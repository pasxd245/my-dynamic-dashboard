[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Placeholder only. The real URL is resolved at runtime in alembic/env.py
# from app.db.get_db_path() (mainstream's data-root app.sqlite), so the
# per-test / MDD_BACKEND__DATA_DIR override flows through to migrations.
sqlalchemy.url = sqlite:///data/app.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
