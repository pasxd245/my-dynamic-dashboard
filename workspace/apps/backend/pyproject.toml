[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "my-dynamic-dashboard-backend"
dynamic = ["version"]
description = "Backend service for my-dynamic-dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "duckdb==1.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.1",
    "build>=1.3.0",
    "hatch>=1.14.2",
]
test = [
    "pytest>=8.3.5",
    "httpx>=0.28.1",
    "coverage>=7.2.7",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "apps/backend/v(?P<version>.*)"
raw-options.root = "../../.."
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: unit-layer tests",
    "integration: integration-layer tests",
    "contract: contract-layer tests",
    "perf: opt-in performance harness tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
