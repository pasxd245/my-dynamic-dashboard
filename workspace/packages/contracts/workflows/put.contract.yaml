openapi: 3.1.0
info:
  title: my-dynamic-dashboard — PUT /workflows/{id}
  version: 0.1.0
  description: |
    R138 — edit a saved workflow's name + definition (source consolidation +
    transform steps) via the UI builder. Every source must still exist in the
    workspace (422); names stay unique per workspace (409).

    Changing the DEFINITION invalidates the materialized output (the frozen
    result no longer matches the definition), so `resolvedColumns` +
    `materializedAt` are cleared on the response — the workflow must be re-run
    (`POST /workflows/{id}/run`). A name-only edit keeps the materialized output.

    R200 (item 4.4) — a PUT whose definition's version (hash) differs from
    the stored one also writes one definition-history row (`#n+1`,
    `change: update`) in the same transaction; a name change with the
    same definition, an unchanged re-save and a refused save write none. Restore is this PUT with an old definition
    (`GET /workflows/{id}/history/{version}`) — it saves a new version. An
    optional `Authorization: Bearer <writer token>` names who made it
    (`changedBy`; `_shared/history.yaml`).

paths:
  /workflows/{id}:
    put:
      operationId: updateWorkflow
      summary: Edit a workflow's name + definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^wf_[0-9a-f]{8}$" }
        - $ref: "../_shared/history.yaml#/components/parameters/WriterToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                definition:
                  $ref: "../_shared/workflow.yaml#/components/schemas/WorkflowDefinition"
      responses:
        "200":
          description: The updated workflow (materialized fields cleared if the definition changed).
          content:
            application/json:
              schema: { $ref: "../_shared/workflow.yaml#/components/schemas/Workflow" }
        "404":
          description: No workflow with this id.
          content:
            application/json:
              schema: { $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorNotFound" }
              examples: { not_found: { value: { code: "not_found" } } }
        "409":
          description: Another workflow in this workspace already has this name.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorNameTaken"
                  - $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorReadOnlyWorkspace"
              examples: { name_taken: { value: { code: "name_taken" } } }
        "422":
          description: |
            A source is invalid (FastAPI validation envelope; `loc` ends at the
            source's index and `msg` starts with the code): not a query/workflow in
            this workspace (`unknown_source`), does not resolve now — deleted,
            drifted, or a workflow never run (`unresolved_source`, R186 W-5), listed
            twice (`duplicate_source`, R186 W-3), or not the first source's shape
            (`sources_diverge`, R186 W-2). R194 — a step operand that references a
            parameter (`{"param": …}`): a workflow declares none (D6).
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: array
                    items:
                      type: object
