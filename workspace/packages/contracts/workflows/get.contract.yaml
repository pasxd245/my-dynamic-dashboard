openapi: 3.1.0
info:
  title: my-dynamic-dashboard — GET /workspaces/{id}/workflows
  version: 0.1.0
  description: R132 — list a workspace's saved workflows, most-recent first.
paths:
  /workspaces/{id}/workflows:
    get:
      operationId: listWorkflows
      summary: List a workspace's workflows
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^ws_[0-9a-f]{8}$" }
      responses:
        "200":
          description: The workspace's workflows, `ORDER BY created_at DESC, id DESC`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "../_shared/workflow.yaml#/components/schemas/Workflow" }
