openapi: 3.1.0
info:
  title: my-dynamic-dashboard — DELETE /workflows/{id}
  version: 0.1.0
  description: R132 — delete a saved workflow. 204 on success, 404 if absent.
paths:
  /workflows/{id}:
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^wf_[0-9a-f]{8}$" }
      responses:
        "204":
          description: Deleted (no body).
        "404":
          description: No workflow with this id.
          content:
            application/json:
              schema: { $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorNotFound" }
              examples: { not_found: { value: { code: "not_found" } } }
