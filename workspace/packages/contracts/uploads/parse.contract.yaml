openapi: 3.1.0
info:
  title: my-dynamic-dashboard — POST /uploads/{temp_id}/parse
  version: 0.1.0
  description: |
    Phase 2 of the two-phase upload flow.

    **Excel path** (R15 original): parses one or more sheets of a
    previously-uploaded workbook with optional per-sheet
    `ParseOptions` (range, has_header), returning per-sheet schema
    + sample rows. Used by the wizard's Sheet → Metadata transition.

    **CSV path** (R26 extension — closes R19 Q1=C design gap):
    re-parses an already-uploaded CSV temp file with new
    `ParseOptions` (skip_rows, has_header). Used by the wizard's
    Metadata-step "Re-parse this file" affordance, giving CSV
    re-parse parity with Excel. R19's "no CSV re-parse" decision
    held until visual verification in R26 surfaced that the user
    couldn't preview parse_options changes before commit.

    Item shape: `sheet` is required for Excel temp uploads and
    must be omitted for CSV temp uploads (the temp upload's
    `sourceFormat` is the source of truth; the BE rejects the
    wrong shape with 422).

paths:
  /uploads/{temp_id}/parse:
    post:
      operationId: parseTempUpload
      summary: Parse sheets (Excel) or re-parse the file (CSV) from a temp upload
      parameters:
        - name: temp_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^tmp_[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      sheet:
                        type: string
                        minLength: 1
                        description: |
                          Excel only — sheet name from the `sheets[]` array
                          returned by `POST /uploads`. Must match exactly
                          (no case normalization). Omit for CSV; the BE
                          rejects sheet+CSV combos with 422.
                      parse_options:
                        $ref: '../_shared/parse-options.yaml#/components/schemas/ParseOptions'
      responses:
        '200':
          description: |
            Per-sheet parse results. Each item is either a success
            (with columns + rowCount + sampleRows) or a failure
            (with error + detail). Individual sheet failures are
            body-carried, **not** HTTP failures — partial-success is
            normal because the wizard wants to render `✗` on the
            failing tab while keeping the others navigable.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [status]
                      properties:
                        sheet:
                          type: string
                          minLength: 1
                          description: |
                            Echoed back for Excel items; omitted for the
                            CSV item. Lets the FE match results to request
                            items by sheet name (Excel) or by position
                            (CSV's single item).
                        status:
                          type: string
                          enum: [ok, failed]
                        # When status = ok:
                        columns:
                          type: array
                          minItems: 1
                          items:
                            $ref: '../_shared/column.yaml#/components/schemas/Column'
                        rowCount:
                          type: integer
                          minimum: 0
                        sampleRows:
                          type: array
                          items:
                            type: array
                            items:
                              type: ['string', 'null']
                        # When status = failed:
                        error:
                          type: string
                          description: Short machine code (e.g., `range_invalid`, `parse_failed`).
                        detail:
                          type: string
                          description: Human-readable explanation.
        '404':
          description: |
            `temp_id` is unknown — either it was never created, or
            the 24h TTL elapsed and the temp directory has been
            swept.
        '422':
          description: |
            Request-level validation failure: malformed body,
            `items` empty, an Excel item missing `sheet`, a CSV
            item carrying `sheet`, a `sheet` name not present in
            the workbook, or CSV `items` length > 1 (CSV is a
            single implicit table).
