openapi: 3.1.0
info:
  title: my-dynamic-dashboard — GET /queries/{id}/rows
  version: 0.1.0
  description: |
    Run a saved query: re-execute its stored definition against its
    source dataset's CURRENT data and return a paged row slice. R69 —
    Saved Query MVP (live re-run, no materialization).

    The endpoint takes NO predicate params of its own — the saved
    `definition` is the source of truth; only pagination (or the R107
    `unpaged=true` fetch) is a query param. R194 — plus one
    `p.<name>=<value>` query parameter per declared query parameter (the
    viewer value, dashboard-filters.md D3; the same spelling as the dashboard
    URL). A `p.` name the query does not use is ignored. `dashboard=<dsh_id>`
    + `widget=<wdg_id>` (both or neither) name the dashboard widget the read is
    for, so the server applies that dashboard's saved control values (D3 level
    2; see `DashboardRef`). The response then carries `resolvedParams`; a query
    without parameters answers exactly as before. The response is the SAME
    `RowsPage` shape as `GET /datasets/{id}/rows` (the BE delegates to the
    shipped `query_dataset_rows` path after hydrating the definition).

    R199 (item 4.3, dashboard-filters.md D4) — plus one
    `f.<controlId>=<v1>,<v2>` query parameter per dashboard `values` control
    (the viewer's shared-filter selection; the same spelling as the dashboard
    URL). **Parsing** (the server reads the RAW query string): the value is
    split on `,` BEFORE percent-decoding; each token is percent-decoded only
    (`+` is a literal plus, never a space); the raw token `~blank` is the
    `(blank)` option, while `%7Eblank` decodes to the literal string
    "~blank"; a `,` inside a value travels as `%2C`, a `~` as `%7E`; an empty
    token between commas is ignored; a repeated `f.<id>` key → the LAST wins;
    an EMPTY value (`f.<id>=`) = the viewer cleared the control (no filter
    from it, its saved selection NOT applied); an absent key = the saved
    selection applies (BA-C2 / BA-C5). With `dashboard` + `widget` the server
    also applies the `saved` selection of every targeted `values` control the
    request does not override (D3 level 2), as a runtime filter
    (`RuntimeFilter` semantics: one-of by column name; a column the result
    lacks is skipped, D5) applied BEFORE paging and the `unpaged` cap, so
    `total` and the rows are the filtered ones. An `f.` key naming NO
    `values` control of the named dashboard (removed since the link was
    copied) is IGNORED, exactly as an unused `p.<name>` is, so a stale link
    keeps opening (BA-C1); one whose control does not target the widget is
    ignored too; `f.` keys without `dashboard` + `widget` → 422
    (`control_without_dashboard`). The widget's OWN drawer filters stay
    client-side on this path (R103); they never travel here.

    R107 — `unpaged=true` returns the result in ONE response (no paging),
    capped server-side at `dashboard_max_rows`. This is the dashboard
    widget's load path: one request instead of a paged-at-100 loop.

    Because the run is live, the result always reflects current data:
    mutating the source dataset between two runs changes the result.
    If the dataset's schema drifted so a saved atom no longer validates
    (a referenced column was removed or retyped), the endpoint returns
    409 `query_stale` instead of executing.

paths:
  /queries/{id}/rows:
    get:
      operationId: runQuery
      summary: Run a saved query (live re-run) and page its rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^qr_[0-9a-f]{8}$'
          description: Query id.
          examples:
            won_deals:
              value: 'qr_9c2f10ab'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: |
            1-indexed page. Out-of-range (`page > ceil(total /
            page_size)`) returns 200 with an empty `rows` array, same
            precedent as the dataset rows-GET. Below 1 returns 422.
        - name: page_size
          in: query
          required: false
          schema:
            allOf:
              - $ref: '../_shared/pagination.yaml#/components/schemas/PageSize'
            default: 50
          description: Rows per page. Closed enum; other values return 422.
        - name: unpaged
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            R107 — single-request (unpaged) fetch. When `true`, `page` and
            `page_size` are IGNORED and the endpoint returns the result rows in
            ONE response, capped server-side at `dashboard_max_rows` (the
            dashboard widget fetch cap). The name describes the mechanism (no
            paging), NOT completeness — an oversized result is still capped.
            Replaces the FE's paged-at-100 fetch-all loop for dashboard widgets.
            `total` still reflects the full matched count, so a consumer can
            detect a capped (partial) result via `total > rows.length`. `page`
            echoes `1`; `pageSize` echoes the returned row count (which may
            exceed the `PageSize` enum, since the unpaged response is not a
            "page" in the pager sense).
      responses:
        '200':
          description: |
            Paged row slice of the live-re-run result. Identical shape
            to `GET /datasets/{id}/rows`. `total` reflects the matched
            count under the saved definition.
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, pageSize, total]
                additionalProperties: false
                properties:
                  rows:
                    type: array
                    description: |
                      Row-major. One cell per source-dataset column, in
                      column order. Cells are stringified BE-side; nulls
                      preserved.
                    items:
                      type: array
                      items:
                        type: [string, 'null']
                  page:
                    type: integer
                    minimum: 1
                    description: Echoed page number.
                  pageSize:
                    type: integer
                    minimum: 0
                    description: |
                      Echoed page size (self-describing for AntD Pagination).
                      A plain integer, not the `PageSize` enum: for a paged
                      response it carries one of the enum values, but the R107
                      `unpaged=true` response echoes the returned row count,
                      which may exceed the enum. Mirrors the BE `RowsPage` model,
                      whose `pageSize` is a plain `int` (R72/R106).
                  total:
                    type: integer
                    minimum: 0
                    description: |
                      Matched-row count under the saved definition. The
                      FE pairs this with the dataset's `rowCount` to
                      render the "Matched X / Y" counter.
                  dataVersions:
                    $ref: '../_shared/query.yaml#/components/schemas/DataVersions'
                  resolvedParams:
                    $ref: '../_shared/query.yaml#/components/schemas/ResolvedParams' 
              examples:
                first_page:
                  summary: First page of a query that matched 312 rows
                  value:
                    rows:
                      [
                        ['D-0001', '12400', '2026-03-01', 'won', '0.95', 'true', '2026-02-28T14:02:00Z'],
                        ['D-0005', '24500', '2026-05-02', 'won', '1.00', 'true', '2026-04-22T08:11:00Z'],
                      ]
                    page: 1
                    pageSize: 50
                    total: 312
                empty_match:
                  summary: The saved definition matched no rows
                  value:
                    rows: []
                    page: 1
                    pageSize: 50
                    total: 0
        '404':
          description: No query with the given `id` exists.
          content:
            application/json:
              schema:
                $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorNotFound'
              examples:
                missing:
                  value: { 'code': 'not_found' }
        '409':
          description: |
            The saved query can't execute against current data — one of:
            - `query_stale` — a saved *predicate* atom no longer validates
              (a filtered column was removed/retyped). R69.
            - `relationship_stale` — a *joined* query (R71) whose consumed
              Relationship's key column drifted, so the join can't run. The
              FE renders the matching "needs attention" / "join unavailable"
              state and points the user at the source dataset or the
              workspace Relationships view to repair.
            - `step_invalid` — a transform step cannot run on the columns available
              at its position (R165).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorQueryStale'
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorRelationshipStale'
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorStepInvalid'
              examples:
                predicate_stale:
                  summary: A saved filter column drifted (R69)
                  value: { 'code': 'query_stale' }
                join_key_stale:
                  summary: A joined query's relationship key drifted (R71)
                  value: { 'code': 'relationship_stale' }
                step_invalid:
                  summary: A transform step cannot run on the columns at its position (R165)
                  value: { 'code': 'step_invalid' }
        '422':
          description: |
            Malformed request — `page < 1`, `page_size` not in
            {10, 25, 50, 100}, or `id` not matching `^qr_[0-9a-f]{8}$`.
            FastAPI validation-error envelope. R194 — or a parameter the
            definition uses has no value (`param_unbound`) or a `p.` value of
            the wrong type (`param_invalid`). R199 — or an `f.` key without
            `dashboard` + `widget` (`control_without_dashboard`) — envelope,
            the `loc` naming the key. (An `f.` key naming no `values` control
            of the dashboard is ignored, not refused — BA-C1.)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [detail]
                    properties:
                      detail:
                        type: array
                        items:
                          type: object
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorParamUnbound'
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorParamInvalid'
