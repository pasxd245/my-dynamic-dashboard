openapi: 3.1.0
info:
  title: my-dynamic-dashboard — POST /workspaces/{id}/datasets/batch
  version: 0.1.0
  description: |
    Atomic batch commit. Promotes one or more parsed sheets from a
    temp upload into permanent Dataset rows under the named
    workspace. All items succeed together or none do — there is no
    partial-success state. CSV uploads send a length-1 batch;
    Excel uploads send a length-N batch where N is the number of
    sheets the user selected in the wizard's Sheet step.

paths:
  /workspaces/{id}/datasets/batch:
    post:
      operationId: commitDatasetsBatch
      summary: Atomic batch-commit datasets from a temp upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^ws_[0-9a-f]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_id, items]
              additionalProperties: false
              properties:
                temp_id:
                  type: string
                  pattern: '^tmp_[0-9a-f]{16}$'
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name]
                    additionalProperties: false
                    properties:
                      sheet:
                        type: string
                        minLength: 1
                        description: |
                          Excel only — the sheet to promote. Omitted on
                          CSV commits (where the temp upload contains a
                          single implicit table).
                      name:
                        type: string
                        minLength: 1
                        maxLength: 120
                        description: Dataset display name (user-supplied).
                      parse_options:
                        $ref: '../_shared/parse-options.yaml#/components/schemas/ParseOptions'
                      column_overrides:
                        type: object
                        description: |
                          Per-column dtype + optional format-string overrides
                          from the wizard's Metadata step. Keys are column
                          names; values are `ColumnOverride` objects.
                          R143 semantics: for the FORMATLESS dtypes
                          (string · integer · float · boolean) the override is
                          APPLIED at the parquet write — stored dtype equals
                          committed `columns_json` dtype; an uncastable cell
                          fails the batch with 422 `coercion_failed`.
                          `date` / `datetime` overrides remain metadata-only
                          relabels until the date-ingest round
                          (upload.md §Commit dtype semantics).
                        additionalProperties:
                          $ref: '../_shared/column-override.yaml#/components/schemas/ColumnOverride'
                      excluded_columns:
                        type: array
                        items:
                          type: string
                        description: |
                          Column names to drop at commit time. At least one
                          column must remain after exclusion.
                      target_dataset_id:
                        type: string
                        pattern: '^ds_[0-9a-f]{8}$'
                        description: |
                          R145 REFRESH mode. When set, the item performs a
                          whole-table REPLACE of the named existing dataset
                          (same id kept, so dependent queries/relationships
                          survive) instead of creating a new one — the parquet,
                          original file, columns_json, counts and commitSettings
                          are atomically swapped; the dataset is left intact if
                          the refresh fails (e.g. coercion_failed). `name` is
                          IGNORED (the target keeps its committed name). A
                          refresh batch carries exactly one item. R147: setting
                          `merge_key` alongside selects MERGE semantics instead
                          of replace.
                      merge_key:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                        description: |
                          R147 MERGE refresh (requires `target_dataset_id`;
                          422 on a create item). Names one or more of the
                          target's COMMITTED columns as the row identity key.
                          Semantics: keep-latest-per-key — an incoming row
                          supersedes ALL committed rows sharing its key
                          (incoming wins, whole row); incoming-only keys
                          insert; committed-only keys are KEPT (the difference
                          from replace). Result schema = the incoming table's
                          schema (D5): kept rows NULL-fill added columns and
                          drop removed ones. Guards (all 422, dataset
                          untouched): key column not in the committed schema;
                          key column missing from the incoming kept columns or
                          committed↔incoming key dtype mismatch (the F5×F2
                          false-non-overlap guard — the one exception to
                          warn-never-block drift); duplicate incoming rows per
                          key → `merge_duplicate_keys` (D2: loud stop, file
                          row order is not time).
                      refresh_mode:
                        type: string
                        enum: [replace, merge, append]
                        description: |
                          R155 — the explicit refresh-semantics discriminator
                          (requires `target_dataset_id`; 422 on a create item).
                          Optional + back-compatible: when OMITTED the mode is
                          inferred as before — `merge` iff `merge_key` is present,
                          else `replace`. `append` MUST be set explicitly (it is
                          keyless, so it cannot be inferred from `merge_key`);
                          `refresh_mode: append` together with `merge_key` → 422
                          (contradictory). APPEND semantics: keyless UNION ALL —
                          every incoming row is appended and every committed row
                          is KEPT (no dedup; duplicates preserved by design).
                          Result schema = the incoming table's (D5: kept rows
                          NULL-fill added columns, drop removed). No dup-key guard
                          (that is merge-only).
                      overlap_check_field:
                        type: string
                        minLength: 1
                        description: |
                          R155 APPEND only — the committed date/datetime column the
                          wizard's double-count check ran on, remembered for the
                          next refresh (F9 carry-forward, like `merge_key`). It is
                          NOT acted on at commit: append keeps all rows regardless
                          (warn-never-block). The advisory overlap preview is the
                          separate `POST /datasets/{id}/append-overlap` read the
                          wizard calls BEFORE commit. Omitted = the user declined
                          the check ("None").
      responses:
        '201':
          description: |
            All items committed atomically. Three shapes (the FE branches on
            `Array.isArray`, then on `merge` vs `append`):

            1. Create / replace-refresh — the created (or updated) Dataset
               rows in the same order as the request `items` array.
            2. MERGE refresh (R147, item carried `merge_key`) — a wrapper
               carrying the updated Dataset plus the merge report counts,
               so the FE can surface what the merge did (`updated` incoming
               rows superseded a committed key, `inserted` were new keys,
               `kept` committed rows had no incoming counterpart;
               updated + inserted + kept = the dataset's new row_count).
            3. APPEND refresh (R155, item carried `refresh_mode: append`) — a
               wrapper carrying the updated Dataset plus `{ appended, total }`
               (rows appended; the new total row_count = committed + appended).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    minItems: 1
                    items:
                      $ref: '../_shared/dataset.yaml#/components/schemas/Dataset'
                  - type: object
                    required: [datasets, merge]
                    additionalProperties: false
                    properties:
                      datasets:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '../_shared/dataset.yaml#/components/schemas/Dataset'
                      merge:
                        type: object
                        required: [updated, inserted, kept]
                        additionalProperties: false
                        properties:
                          updated:
                            type: integer
                            minimum: 0
                            description: Incoming rows whose key superseded committed row(s).
                          inserted:
                            type: integer
                            minimum: 0
                            description: Incoming rows with a key new to the dataset.
                          kept:
                            type: integer
                            minimum: 0
                            description: Committed rows kept (key absent from the incoming file).
                  - type: object
                    required: [datasets, append]
                    additionalProperties: false
                    properties:
                      datasets:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '../_shared/dataset.yaml#/components/schemas/Dataset'
                      append:
                        type: object
                        required: [appended, total]
                        additionalProperties: false
                        properties:
                          appended:
                            type: integer
                            minimum: 0
                            description: Incoming rows appended (R155 keyless union).
                          total:
                            type: integer
                            minimum: 0
                            description: The dataset's new row_count (committed + appended).
        '404':
          description: |
            Workspace `id` does not exist, OR `temp_id` is unknown / expired,
            OR a refresh item's `target_dataset_id` does not exist. The response
            body does not distinguish (deliberately — clients should not branch
            on which is missing).
        '409':
          description: |
            Commit-time conflict. Two body shapes are possible:

            1. The legacy `{ error, detail }` shape — covers
               parse_options mismatches, unknown columns referenced
               by `excluded_columns` / `column_overrides`, etc.
            2. The R25 code-first envelope `{ code: "name_taken" }`
               — returned when any item's `name` collides with an
               existing dataset in the same workspace (the new
               unique index on `datasets(workspace_id, name)`).

            The FE branches on whether a `code` field is present:
            if yes, narrow to the new envelope; otherwise treat as
            the legacy shape. Future round may unify if drift bites.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: string
                      detail:
                        type: string
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorNameTaken'
        '422':
          description: |
            Two body shapes are possible (the FE branches on whether a
            top-level `code` field is present, same rule as the 409):

            1. The FastAPI `{ detail: ... }` envelope — request-level
               validation failures. Examples: empty `items` array;
               empty `excluded_columns` would leave zero columns;
               `column_overrides` value has `dtype: date|datetime`
               without a `format` field.
            2. The code-first envelope `{ code: "coercion_failed", … }`
               (R143) — a commit-time dtype cast failed: some non-NULL
               cell cannot convert to an override's target dtype. Names
               the sheet, column, target dtype, the first 5 offending
               cells (1-indexed data rows), and the total failed count.
               The whole batch aborts — nothing is committed.
            3. The code-first envelope `{ code: "merge_duplicate_keys", … }`
               (R147) — a merge refresh's incoming file carries more than
               one row per declared key (D2: loud stop). Names the key,
               the duplicated-value count, and up to 5 sample key values.
               The dataset is untouched.

            R147 merge guards using shape 1 (detail string): `merge_key` on
            a create item; key column unknown to the committed schema; key
            column missing from the incoming kept columns; committed↔incoming
            key dtype mismatch; kept committed rows failing the cast to a
            drifted incoming column dtype.

            R155 append guards using shape 1 (detail string): `refresh_mode`
            (any value) on a create item — no `target_dataset_id`;
            `refresh_mode: append` together with `merge_key` (contradictory).

            R147 also maps a commit-time SOURCE PARSE failure (an item's
            `sheet` not in the uploaded workbook — the renamed-sheet cadence —
            or a malformed range) to shape 1 (`parse_failed: …`), on both
            create and refresh items. Previously this raised an unhandled 500
            (the parse endpoint mapped these; the commit path didn't). A
            refresh fails BEFORE any write — the dataset is untouched.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [detail]
                    properties:
                      detail: {}
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorCoercionFailed'
                  - $ref: '../_shared/api-error.yaml#/components/schemas/ApiErrorMergeDuplicateKeys'
