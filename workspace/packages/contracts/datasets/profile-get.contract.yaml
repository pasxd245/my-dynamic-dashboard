openapi: 3.1.0
info:
  title: my-dynamic-dashboard — GET /datasets/{id}/profile
  version: 0.1.0
  description: |
    Per-column data profile computed on demand from the dataset's parquet
    via DuckDB (R154). One call returns stats for EVERY column. This is a
    read-only compute over the stored data — it never writes `columns_json`
    or the parquet (the R152/R153 view-hint doctrine).

    Cost guard (the round's headline risk): a profile is a full-scan
    aggregate, so on a wide/deep parquet computing it on every drawer-open
    would be a silent latency/CPU cost. The backend scans the full file when
    `rowCount <= PROFILE_FULL_SCAN_MAX` and otherwise runs an approximate
    `USING SAMPLE n ROWS` scan; the response then carries `approx: true` and
    `sampledRows` so the UI can label the stats as approximate. Nothing is
    cached server-side — the cost is re-paid per call but bounded. A cache is
    a deferred additive if a real perf complaint lands (the Properties panel
    is the consumer, so the cost lands on drawer-open).

    Per-dtype stat matrix (all fields are present on every column object;
    null where the stat does not apply to that dtype):
      - every column:              nullCount, nullPct, distinctCount
      - integer/float/date/datetime: min, max      (sample null)
      - string:                      sample (top-k) (min, max null)
      - boolean:                     null/distinct only (min, max, sample null)
    `format` carries the date/datetime display pattern from the last commit's
    `commitSettings.column_overrides[<name>].format`; null when the column has
    no such override. It rides this response so the Properties drawer's Columns
    section needs no second fetch.

    `min` / `max` / `sample` are stringified (`string | null`) for the same
    reason as the rows payload (see rows-get.contract.yaml): the wire stays
    schema-free and the FE re-applies dtype-aware display via the column dtype.

paths:
  /datasets/{id}/profile:
    get:
      operationId: getDatasetProfile
      summary: Per-column profile (null/distinct/min-max/sample), computed on demand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ds_[0-9a-f]{8}$"
          description: Dataset id.
          examples:
            deals:
              value: "ds_71a4e2f0"
      responses:
        "200":
          description: |
            Per-column stats for every column of the dataset. `approx` is
            true when computed on a sample rather than a full scan.
          content:
            application/json:
              schema:
                type: object
                required: [datasetId, rowCount, approx, sampledRows, columns]
                additionalProperties: false
                properties:
                  datasetId:
                    type: string
                    pattern: "^ds_[0-9a-f]{8}$"
                  rowCount:
                    type: integer
                    minimum: 0
                    description: The dataset's full committed row count.
                  approx:
                    type: boolean
                    description: true when stats were computed on a sample, not a full scan.
                  sampledRows:
                    type: [integer, "null"]
                    minimum: 0
                    description: |
                      Rows scanned when `approx` is true; null on a full scan.
                  columns:
                    type: array
                    items:
                      type: object
                      required:
                        [name, dtype, format, nullCount, nullPct, distinctCount, min, max, sample]
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        dtype:
                          type: string
                          enum: [string, integer, float, boolean, date, datetime]
                        format:
                          type: [string, "null"]
                          description: |
                            Date/datetime display pattern from the last commit's
                            column_overrides; null if the column has no override.
                        nullCount:
                          type: integer
                          minimum: 0
                        nullPct:
                          type: number
                          minimum: 0
                          maximum: 100
                          description: nullCount / rowCount * 100 (0 when rowCount is 0).
                        distinctCount:
                          type: integer
                          minimum: 0
                          description: |
                            Distinct non-null values. On an approximate scan this
                            is the distinct count within the sample.
                        min:
                          type: [string, "null"]
                          description: |
                            Stringified minimum for numeric/date/datetime columns;
                            null for string/boolean.
                        max:
                          type: [string, "null"]
                          description: |
                            Stringified maximum for numeric/date/datetime columns;
                            null for string/boolean.
                        sample:
                          type: [array, "null"]
                          items:
                            type: [string, "null"]
                          description: |
                            Top-k most-frequent sample values for string columns;
                            null for numeric/date/datetime/boolean.
              examples:
                deals_full_scan:
                  summary: Small dataset — full scan, exact stats
                  value:
                    datasetId: "ds_71a4e2f0"
                    rowCount: 7
                    approx: false
                    sampledRows: null
                    columns:
                      - name: "deal_id"
                        dtype: "string"
                        format: null
                        nullCount: 0
                        nullPct: 0
                        distinctCount: 7
                        min: null
                        max: null
                        sample: ["D-001", "D-002", "D-003"]
                      - name: "amount"
                        dtype: "integer"
                        format: null
                        nullCount: 0
                        nullPct: 0
                        distinctCount: 7
                        min: "1200"
                        max: "58000"
                        sample: null
                      - name: "won_at"
                        dtype: "date"
                        format: "dd/MM/yyyy"
                        nullCount: 1
                        nullPct: 14.29
                        distinctCount: 6
                        min: "2026-01-04"
                        max: "2026-06-30"
                        sample: null
                      - name: "is_priority"
                        dtype: "boolean"
                        format: null
                        nullCount: 0
                        nullPct: 0
                        distinctCount: 2
                        min: null
                        max: null
                        sample: null
                large_sampled:
                  summary: Large dataset — approximate scan on a sample
                  value:
                    datasetId: "ds_71a4e2f0"
                    rowCount: 4200000
                    approx: true
                    sampledRows: 200000
                    columns:
                      - name: "amount"
                        dtype: "integer"
                        format: null
                        nullCount: 128
                        nullPct: 0.06
                        distinctCount: 41233
                        min: "0"
                        max: "992310"
                        sample: null
        "404":
          description: |
            No dataset with the given `id` exists.
          content:
            application/json:
              schema:
                $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorNotFound"
              examples:
                missing:
                  value: { "code": "not_found" }
