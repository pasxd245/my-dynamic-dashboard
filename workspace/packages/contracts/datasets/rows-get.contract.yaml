openapi: 3.1.0
info:
  title: my-dynamic-dashboard — GET /datasets/{id}/rows
  version: 0.1.0
  description: |
    Get a paged slice of a dataset's rows. R33 designed; R34
    contract round (with R33-amend `?q=` substring filter); R38
    extended with per-column typed filters (`f<N>_*` params).

    Powers the data table on the dataset detail page. Cells are
    transported as `string | null`; the FE re-applies dtype-aware
    display formatting using the column dtypes carried on the
    parent `Dataset` (fetched via `GET /datasets/{id}`). The
    response shape lives inline (no `_shared/rows-page.yaml`
    extraction) because there is only one paged-rows consumer
    today.

    The optional `q` query param applies a case-insensitive
    substring filter across every cell's stringified value; a
    row matches if any of its cells contains `q`. When `q` is
    present, `total` reflects the matched-row count (not the
    full dataset row count) — the FE uses `Dataset.rowCount` for
    the "X / Y" match counter UI.

    The optional `f<N>_*` query params apply per-column typed
    filters (R38), where `<N>` is the 0-based index into
    `Dataset.columns[]`. Each column contributes at most one
    predicate; multiple predicates compose with implicit AND.
    Filters AND-compose with `?q=` (filters evaluate first,
    then the `?q=` substring runs over the filtered result).
    When ≥ 1 filter is active, `total` reflects the AND-composed
    matched-row count. See
    [dataset-filters.md § Predicate vocabulary table](../../../../.agents/design/data-management/dataset-filters.md#predicate-vocabulary-table)
    for the authoritative per-dtype operator set and value-shape
    spec.

    The optional `aq` query param (R51) carries an **advanced
    query** in disjunctive normal form (DNF) — an OR of AND-groups
    — that the flat `f<N>_*` shape cannot express (it is keyed by
    column index, one predicate per column, AND-only). `aq` is a
    URL-encoded JSON array-of-arrays of the **same** predicate
    atoms `f<N>_*` produces; the outer array ORs its groups, each
    inner array ANDs its atoms. `aq` AND-composes with both
    `f<N>_*` and `?q=`. The query grammar is a pure frontend
    concern (the BE receives validated predicate JSON, never query
    text). See
    [advanced-query.md](../../../../.agents/design/data-management/advanced-query.md)
    for the grammar and
    [advanced-query.md § Data contract](../../../../.agents/design/data-management/advanced-query.md#data-contract-target-for-the-contract-phase)
    for the transport rationale.

paths:
  /datasets/{id}/rows:
    get:
      operationId: getDatasetRows
      summary: Get a paged slice of a dataset's rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ds_[0-9a-f]{8}$"
          description: Dataset id.
          examples:
            deals:
              value: "ds_71a4e2f0"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: |
            1-indexed page number. Out-of-range values
            (`page > ceil(total / page_size)`) return 200 with
            an empty `rows` array — the filter expression is
            well-formed even if it matches nothing, matching
            the precedent set by `GET /datasets?workspace_id=`.
            A value below 1 returns 422 (malformed request).
        - name: page_size
          in: query
          required: false
          schema:
            allOf:
              - $ref: "../_shared/pagination.yaml#/components/schemas/PageSize"
            default: 50
          description: |
            Rows per page. The closed enum mirrors the FE's
            AntD `<Pagination>` page-size selector — only these
            three values exist as UI affordances. Any other
            value returns 422.
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: |
            Optional substring filter. Case-insensitive match
            against the stringified value of any cell in the
            row; a row matches when any of its cells contains
            `q`. When present, `total` reflects the matched-
            row count (not the dataset's full row count). When
            absent, behavior is identical to the unfiltered
            paged read. `q < 1` char is treated as absent
            (FE strips empty input before sending); `q > 200`
            chars returns 422.
        # ─── Per-column filter params (R38) ──────────────────
        # The four `f0_*` entries below illustrate the shape;
        # the actual parameter set is `f<N>_op`, `f<N>_val`,
        # `f<N>_min`, `f<N>_max` for any 0-based column index
        # N < Dataset.columnCount. OpenAPI 3.1 has no native way
        # to declare a key parameterized by N; the prose
        # description on `f0_op` carries the convention.
        - name: f0_op
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter operator for column 0. The four `f<N>_*`
            params (`op`, `val`, `min`, `max`) define a
            per-column typed predicate where `<N>` is the
            0-based index into `Dataset.columns[]`. Multiple
            columns compose with implicit AND; per-column there
            is at most one predicate. AND-composes with `?q=`.

            Allowed operator values depend on `Dataset.columns[N].dtype`:

            - `string`: `contains`, `equals`, `starts_with`,
              `ends_with`, `is_empty`, `is_not_empty`, `is_null`,
              `is_not_null`.
            - `integer`, `float`: `equals`, `ne`, `gt`, `lt`,
              `gte`, `lte`, `between`, `is_null`, `is_not_null`.
            - `date`, `datetime`: `equals`, `ne`, `before`,
              `after`, `between`, `is_null`, `is_not_null`.
            - `boolean`: `is_true`, `is_false`, `is_null`,
              `is_not_null`.

            See the authoritative cross-stack spec in
            [dataset-filters.md](../../../../.agents/design/data-management/dataset-filters.md#predicate-vocabulary-table).
            Operator validity is dtype-dependent and not
            expressible as a static `schema.enum` (a single
            enum would either reject valid ops or accept
            invalid ones depending on the column). The BE
            performs the per-dtype check and returns 422 with
            a descriptive `detail[].msg` on mismatch.
        - name: f0_val
          in: query
          required: false
          schema:
            type: string
          description: |
            Single-operand value for the column-0 predicate.
            Required when the operator takes one value
            (`contains`, `equals`, `ne`, `gt`, `lt`, `gte`,
            `lte`, `starts_with`, `ends_with`, `before`,
            `after`). Omitted for no-operand ops (`is_empty`,
            `is_not_empty`, `is_null`, `is_not_null`,
            `is_true`, `is_false`) and for `between` (use
            `f<N>_min` / `f<N>_max` instead).

            The wire format is `string` (lexical envelope); the
            BE parses per `Dataset.columns[N].dtype`:

            - `integer` → signed int64.
            - `float` → IEEE-754 double.
            - `date` → ISO `YYYY-MM-DD`.
            - `datetime` → ISO `YYYY-MM-DDTHH:MM:SS`
              (timezone-naive; local-time-of-day per the R36
              cell-format convention).
            - `boolean` → not applicable (booleans use
              `is_true` / `is_false` ops with no value).
            - `string` → utf-8 verbatim.

            Parse failure (e.g. `f0_op=equals&f0_val=foo` on an
            `integer` column) returns 422.
        - name: f0_min
          in: query
          required: false
          schema:
            type: string
          description: |
            Lower bound for the column-0 `between` predicate
            (inclusive). Required when `f0_op=between`; ignored
            otherwise. Same per-dtype parse rule as `f0_val`.
            `f0_min > f0_max` returns 422.
        - name: f0_max
          in: query
          required: false
          schema:
            type: string
          description: |
            Upper bound for the column-0 `between` predicate
            (inclusive). Required when `f0_op=between`; ignored
            otherwise. Same per-dtype parse rule as `f0_val`.
        # ─── Advanced query param (R51) ──────────────────────
        - name: aq
          in: query
          required: false
          schema:
            type: string
          description: |
            Advanced query in disjunctive normal form (DNF),
            URL-encoded JSON: an array of AND-groups, OR'd
            together. The outer array is the OR; each inner array
            is an AND-group of predicate atoms. An atom is the
            **same** object shape as a `f<N>_*` predicate:

            ```json
            [
              [ {"col":3,"dtype":"string","op":"equals","val":"won"},
                {"col":1,"dtype":"integer","op":"gt","val":10000} ],
              [ {"col":3,"dtype":"string","op":"equals","val":"lost"} ]
            ]
            ```

            decodes to `(stage=won AND amount>10000) OR
            (stage=lost)`. `col` is the 0-based index into
            `Dataset.columns[]`; `dtype` must equal that column's
            dtype; `op` + operand fields (`val` / `min` / `max`)
            follow the same per-dtype vocabulary and operand-shape
            rules as `f<N>_*` (see
            [dataset-filters.md § Predicate vocabulary table](../../../../.agents/design/data-management/dataset-filters.md#predicate-vocabulary-table)).

            `aq` AND-composes with `f<N>_*` and `?q=`: the final
            match set is
            `chip-filters(AND) ∧ aq(OR-of-AND) ∧ q(substring)`.
            When `aq` is active, `total` reflects the fully
            composed matched count.

            The query **grammar / syntax** (e.g.
            `stage:won AND amount:>10000`) is a pure frontend
            concern; the BE receives only this validated predicate
            JSON, never the raw query text. Malformed JSON (or a
            structure that is not an array-of-arrays-of-objects)
            returns 422 `advanced_query_malformed`; a structurally
            valid atom that fails a per-atom check returns the
            existing `filter_*` code with `loc = ["query", "aq"]`.
      responses:
        "200":
          description: |
            Paged row slice. `rows.length` is at most
            `page_size`; the final page may be shorter. `total`
            reflects the matched-row count under the active
            predicate set: equal to `Dataset.rowCount` when no
            `?q=` and no `f<N>_*` filters are active; the
            substring-matched count when only `?q=` is set; the
            AND-composed matched count when filters and/or
            `?q=` are active. The trio of `page` / `pageSize` /
            `total` is enough for the FE `<Pagination>` to
            render without a second round trip.
          content:
            application/json:
              schema:
                type: object
                required: [rows, page, pageSize, total]
                additionalProperties: false
                properties:
                  rows:
                    type: array
                    description: |
                      Row-major ordering. Inner arrays carry one
                      cell per column in the same column order
                      as `Dataset.columns[]`. Cells are
                      stringified BE-side per dtype; nulls are
                      preserved.
                    items:
                      type: array
                      items:
                        type: [string, "null"]
                  page:
                    type: integer
                    minimum: 1
                    description: Echoed page number.
                  pageSize:
                    allOf:
                      - $ref: "../_shared/pagination.yaml#/components/schemas/PageSize"
                    description: |
                      Echoed page size. Redundant with the
                      request param, kept so the response is
                      self-describing and can be passed
                      verbatim to AntD `<Pagination>`.
                  total:
                    type: integer
                    minimum: 0
                    description: |
                      Matched-row count under the active
                      predicate set. Equals `Dataset.rowCount`
                      when no `?q=` and no `f<N>_*` filters are
                      active; equals the substring-matched count
                      when only `?q=` is set; equals the
                      AND-composed matched count when filters
                      and/or `?q=` are active. The FE pairs this
                      with `Dataset.rowCount` to render the
                      "Matched X / Y" counter regardless of
                      which predicate(s) are active.
              examples:
                full_first_page:
                  summary: First page of a 2,481-row dataset (50 rows of 50)
                  value:
                    rows:
                      [
                        ["D-0001", "12400", "2026-03-01", "won", "0.95", "true", "2026-02-28T14:02:00Z", "quick close, no contention"],
                        ["D-0002", null, null, "open", "0.45", "false", "2026-03-15T09:18:00Z", null],
                        ["D-0003", "102000", "2026-04-12", "negotiating", "0.72", "true", "2026-04-01T11:30:00Z", "budget approved; awaiting legal sign-off"],
                      ]
                    page: 1
                    pageSize: 50
                    total: 2481
                partial_last_page:
                  summary: Last page (31 of a 2,481-row dataset @ page_size 50)
                  value:
                    rows:
                      [
                        ["D-2480", "8200", "2026-05-25", "won", "0.99", "false", "2026-05-25T08:00:00Z", "final renewal"],
                        ["D-2481", "1100", null, "open", "0.50", "false", "2026-05-26T09:12:00Z", null],
                      ]
                    page: 50
                    pageSize: 50
                    total: 2481
                out_of_range_empty:
                  summary: page > ceil(total / page_size) returns empty rows, not 422
                  value:
                    rows: []
                    page: 999
                    pageSize: 50
                    total: 2481
                zero_rows_dataset:
                  summary: A dataset that committed with 0 rows
                  value:
                    rows: []
                    page: 1
                    pageSize: 50
                    total: 0
                filtered_subset:
                  summary: ?q=won — substring matches 1,204 of 2,481 rows; total reflects the matched count
                  value:
                    rows:
                      [
                        ["D-0001", "12400", "2026-03-01", "won", "0.95", "true", "2026-02-28T14:02:00Z", "quick close, no contention"],
                        ["D-0005", "24500", "2026-05-02", "won", "1.00", "true", "2026-04-22T08:11:00Z", "renewal — multi-year"],
                      ]
                    page: 1
                    pageSize: 50
                    total: 1204
                filtered_no_match:
                  summary: ?q=ZZZZZ — no rows match; FE renders the "No rows match" state
                  value:
                    rows: []
                    page: 1
                    pageSize: 50
                    total: 0
                filtered_per_column_string_equals:
                  summary: |
                    ?f3_op=equals&f3_val=won — column 3 (`stage`) equals "won";
                    1,204 rows match
                  value:
                    rows:
                      [
                        ["D-0001", "12400", "2026-03-01", "won", "0.95", "true", "2026-02-28T14:02:00Z", "quick close, no contention"],
                        ["D-0005", "24500", "2026-05-02", "won", "1.00", "true", "2026-04-22T08:11:00Z", "renewal — multi-year"],
                      ]
                    page: 1
                    pageSize: 50
                    total: 1204
                filtered_per_column_numeric_between:
                  summary: |
                    ?f1_op=between&f1_min=10000&f1_max=50000 — column 1 (`amount`)
                    inclusive range; 412 rows match
                  value:
                    rows:
                      [
                        ["D-0001", "12400", "2026-03-01", "won", "0.95", "true", "2026-02-28T14:02:00Z", "quick close, no contention"],
                        ["D-0017", "48200", "2026-04-08", "won", "0.92", "true", "2026-04-01T10:20:00Z", null],
                      ]
                    page: 1
                    pageSize: 50
                    total: 412
                filtered_compose_q_and_filter:
                  summary: |
                    ?q=renewal&f3_op=equals&f3_val=won — AND-composes the
                    substring search with the per-column filter; 47 rows match
                  value:
                    rows:
                      [
                        ["D-0005", "24500", "2026-05-02", "won", "1.00", "true", "2026-04-22T08:11:00Z", "renewal — multi-year"],
                      ]
                    page: 1
                    pageSize: 50
                    total: 47
                filtered_advanced_or:
                  summary: |
                    ?aq=[[{stage=won}],[{stage=lost}]] — advanced query with
                    OR across the same column; union of both groups, 1,533 rows
                  value:
                    rows:
                      [
                        ["D-0001", "12400", "2026-03-01", "won", "0.95", "true", "2026-02-28T14:02:00Z", "quick close, no contention"],
                        ["D-0006", "3200", null, "lost", "0.00", "false", "2026-05-05T13:45:00Z", null],
                      ]
                    page: 1
                    pageSize: 50
                    total: 1533
                filtered_advanced_compose_all:
                  summary: |
                    ?q=renewal&f1_op=gt&f1_val=10000&aq=[[{stage=won}],[{stage=lost}]]
                    — chip ∧ advanced(OR) ∧ q, three-way AND-compose; 1 row
                  value:
                    rows:
                      [
                        ["D-0005", "24500", "2026-05-02", "won", "1.00", "true", "2026-04-22T08:11:00Z", "renewal — multi-year"],
                      ]
                    page: 1
                    pageSize: 50
                    total: 1
        "404":
          description: |
            No dataset with the given `id` exists. Same envelope
            as `GET /datasets/{id}`'s 404.
          content:
            application/json:
              schema:
                $ref: "../_shared/api-error.yaml#/components/schemas/ApiErrorNotFound"
              examples:
                missing:
                  value: { "code": "not_found" }
        "422":
          description: |
            Malformed request. FastAPI's default request-
            validation envelope; the shape is documented upstream
            and not duplicated here. Triggers:

            - `page < 1` or non-integer.
            - `page_size` not in `{10, 25, 50, 100}`.
            - `id` not matching `^ds_[0-9a-f]{8}$`.
            - `q` longer than 200 chars.
            - **Filter-related (R38)**:
              - `f<N>_op` is not a valid operator for
                `Dataset.columns[N].dtype`
                (e.g. `f1_op=contains` on an integer column).
                `detail[].msg` =
                `filter_op_dtype_mismatch: op '<op>' is not valid for dtype '<dtype>'`.
              - `f<N>_val` (or `_min` / `_max`) fails the
                per-dtype parse rule
                (e.g. `f1_op=equals&f1_val=foo` on integer).
                `detail[].msg` =
                `filter_value_unparseable: column <N> (<dtype>) cannot parse '<val>'`.
              - `f<N>_*` for `N >= Dataset.columnCount`.
                `detail[].msg` =
                `filter_col_out_of_range: column <N> does not exist (columnCount = <C>)`.
              - `f<N>_op=between` without both `f<N>_min` and
                `f<N>_max`, or `f<N>_min > f<N>_max`,
                or operand-shape mismatch (`val` supplied with
                `between`, `min`/`max` supplied with a
                single-operand op).
                `detail[].msg` =
                `filter_operand_shape: column <N> op '<op>' expects <expected-fields>`.
            - **Advanced-query-related (R51)**:
              - `aq` is not valid JSON, or not an
                array-of-arrays-of-objects.
                `detail[].msg` =
                `advanced_query_malformed: <reason>`,
                `loc = ["query", "aq"]`.
              - an atom inside `aq` fails a per-atom check
                (bad column index, op invalid for the column's
                dtype, unparseable value, operand-shape mismatch)
                → the same `filter_*` code as the equivalent
                `f<N>_*` failure, with `loc = ["query", "aq"]`.
          content:
            application/json:
              schema:
                type: object
                description: FastAPI request-validation error envelope.
                required: [detail]
                properties:
                  detail:
                    type: array
                    items:
                      type: object
              examples:
                filter_dtype_mismatch:
                  summary: |
                    f1_op=contains on an `integer` column —
                    `contains` is only valid for `string` dtype
                  value:
                    detail:
                      - loc: [query, f1_op]
                        msg: "filter_op_dtype_mismatch: op 'contains' is not valid for dtype 'integer'"
                        type: value_error
