# Shared schema: Query (R69 — Saved Query MVP)
# Used by: queries/post (response), queries/get (response items),
#          queries/detail-get (response).
# Matches the data model in .agents/design/data-management/queries/queries.md (§ Data model)
# and the backend Query SQLModel entity.
#
# A Query is a named, saved definition that produces a virtual dataset by
# re-running a set of predicates against ONE source Dataset (D-4). The
# `definition` reuses the EXACT predicate-atom shape the rows-GET endpoint
# already transports (`f<N>_*` chip filters + the `aq` DNF) — no new query
# vocabulary, just persistence.
components:
  schemas:
    Operand:
      description: |
        R194 — a literal operand (string or number), or a reference to one of
        the query's declared parameters (`ParamRef`). A reference is allowed
        ONLY here — filter atom / filter-step / `case` WHEN operands
        (dashboard-filters.md D2) — never `refCol`, never an output constant,
        never in a workflow step.
      oneOf:
        - type: [string, number]
        - $ref: '#/components/schemas/ParamRef'

    ParamRef:
      type: object
      required: [param]
      additionalProperties: false
      description: |
        R194 (D1) — `{"param": "<name>"}` written exactly where a literal operand
        would be. The value is chosen at read time (D3); it is never written into
        the definition, so reads with different values share one
        `definitionVersion`.
      properties:
        param:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'

    RelativeDate:
      type: object
      required: [kind, offsetDays]
      additionalProperties: false
      description: |
        R194 (D1) — "today ± n days", resolved by the server in
        `backend.time_zone` (IANA, default `UTC`) at read time. Yesterday is
        `{"kind": "today", "offsetDays": -1}`.
      properties:
        kind:
          type: string
          enum: [today]
        offsetDays:
          type: integer
          minimum: -366
          maximum: 366

    QueryParam:
      type: object
      required: [name, type]
      additionalProperties: false
      description: |
        R194 (D1) — a typed parameter the query declares. Part of the definition
        and its hash. `default` is a literal of the type (a `date` as
        `YYYY-MM-DD`); a `date` default may instead be relative (`RelativeDate`).
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Unique in the query.
        type:
          type: string
          enum: [date, number, string]
        label:
          type: string
          minLength: 1
          maxLength: 60
        default:
          oneOf:
            - type: [string, number]
            - $ref: '#/components/schemas/RelativeDate'

    ParamValues:
      type: object
      description: |
        R194 (D3 level 1, "viewer") — values for the query's parameters, by name.
        A date is `YYYY-MM-DD`. An entry the query does not declare is ignored
        (and not echoed).
      maxProperties: 16
      additionalProperties:
        type: [string, number]

    DashboardParamValues:
      type: object
      description: |
        R194 (D3 level 2, "dashboard") — the values saved on the dashboard's
        controls bound to these parameter names, sent by the dashboard with each
        read (the controls themselves land in 3.7b). A date may be relative.
        Used only where no viewer value is given.
      maxProperties: 16
      additionalProperties:
        oneOf:
          - type: [string, number]
          - $ref: '#/components/schemas/RelativeDate'

    ResolvedParams:
      type: object
      description: |
        R194 (D3, D7) — what a read used, by parameter name: the value (a date as
        `YYYY-MM-DD`, relative defaults already resolved) and which level it came
        from. Present only when the query declares parameters and the read
        resolved at least one; a query without parameters answers without this
        key, exactly as before.
      additionalProperties:
        type: object
        required: [value, source]
        additionalProperties: false
        properties:
          value:
            type: [string, number]
          source:
            type: string
            enum: [viewer, dashboard, default]

    FilterAtom:
      type: object
      description: |
        One predicate atom — the same object shape carried by the
        rows-GET `aq` param (see datasets/rows-get.contract.yaml § aq).
        `col` is the 0-based index into the source Dataset.columns[];
        `dtype` must equal that column's dtype; `op` + operand fields
        (`val` / `min` / `max`) follow the per-dtype vocabulary in
        .agents/design/data-management/datasets/dataset-filters.md.
      required: [col, dtype, op]
      additionalProperties: false
      properties:
        col:
          type: integer
          minimum: 0
          description: 0-based index into the source Dataset.columns[].
        dtype:
          type: string
          enum: [string, integer, float, boolean, date, datetime]
          description: Must equal the dtype of Dataset.columns[col].
        op:
          type: string
          description: |
            Operator key. Validity is dtype-dependent (not a static
            enum) and re-checked by the BE on save and on run, exactly
            as the rows-GET `aq` atoms are checked.
        val:
          $ref: '#/components/schemas/Operand'
          description: Single-operand value (ops that take one value), or a parameter (R194).
        min:
          $ref: '#/components/schemas/Operand'
          description: Lower bound for `between` (inclusive), or a parameter (R194).
        max:
          $ref: '#/components/schemas/Operand'
          description: Upper bound for `between` (inclusive), or a parameter (R194).
        vals:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Operand'
          description: |
            R176 — the value list for `in` / `not_in` (every dtype but boolean), each
            parsed per dtype like `val`. Strings compare case-insensitively; `not_in`
            excludes NULL rows (the `ne` rule). Atom-only: the chip grammar
            (`f<N>_*`) does not carry list ops.
        refCol:
          type: integer
          minimum: 0
          description: |
            R176 — compare against ANOTHER column (its 0-based index) instead of a
            literal `val`, for `equals` / `ne` / `gt` / `lt` / `gte` / `lte` /
            `before` / `after`. Same dtype family only (number·number,
            date·datetime, string·string for equals/ne). Mutually exclusive with `val`
            and with any parameter reference on the atom (R194).

    JoinStep:
      type: object
      description: |
        One join hop. R71 introduced a single hop; R73 chains an ordered LIST
        of them (`QueryDefinition.joins`). R74 generalizes the topology from a
        linear chain to a connected acyclic TREE: each hop's LEFT/driving dataset
        is ANY dataset already in the graph (not just the tail), so one dataset
        may be joined to two or more others (a star). The hops are stored in
        topological order. R88 — a hop now consumes a QUERY-OWNED relationship
        (`queryRelId` → a `QueryRelationship` in this definition's
        `relationships[]`), not a governed `rel_` by id; the keys + datasets come
        from that QueryRelationship, only `type` is a query-time choice. See
        .agents/design/data-management/queries/queries.md (§ Joins) and the
        query-owned-relationships brainstorm.
      required: [queryRelId, type]
      additionalProperties: false
      properties:
        queryRelId:
          type: string
          pattern: '^qrel_[0-9a-f]{8}$'
          description: |
            R88 — the QUERY-OWNED relationship this hop consumes: an id into this
            definition's `relationships[]`. Replaces R71–R87's `relationshipId`
            (→ a governed `rel_`): a query now owns its join edges (copy-on-pick
            or, R89, free-form), so a hop references a local `QueryRelationship`,
            not the workspace store. Its left/right datasets + validated key pair
            are the join's sources + ON clause.
          examples: ['qrel_4d7b91ce']
        type:
          type: string
          enum: [inner, left, right, full]
          default: inner
          description: |
            The join type for this hop (R75). `inner` (default) keeps only matched
            rows; `left` keeps all left/driving rows (unmatched right = NULL);
            `right` keeps all right rows; `full` keeps all rows from both sides.
            A graph may mix types per hop. Composite keys / self-joins remain
            deferred (joins.md § Scope).

    QueryRelationship:
      type: object
      description: |
        R88 — a QUERY-OWNED join relationship: the same join fields as a governed
        Relationship (_shared/relationship.yaml), but stored INSIDE a
        QueryDefinition and scoped to that query. Seeded by COPY-ON-PICK (picking a
        governed `rel_` copies its current fields here, recording
        `originRelationshipId` as provenance) or — R89 — defined free-form. Because
        the query carries its own copy, editing/deleting the governed rel never
        breaks the saved query (it runs on this snapshot); a later round may
        PROMOTE a query-owned rel back up to the governed ER. The connected-acyclic
        TREE + per-hop dtype-compat validation are unchanged (re-checked against
        current dataset columns on save/run). See the query-owned-relationships
        brainstorm.
      required: [id, leftSourceId, leftColumn, rightSourceId, rightColumn, cardinality]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^qrel_[0-9a-f]{8}$'
          description: Query-local id, referenced by `JoinStep.queryRelId`.
          examples: ['qrel_4d7b91ce']
        leftSourceId:
          type: string
          pattern: '^ds_[0-9a-f]{8}$'
          description: |
            R91 — the LEFT source of this edge. A hop's left is always already in
            the graph (the tree invariant), so it is a dataset (`ds_…`) this round
            — `qr_` on the LEFT is deferred (right-side-first). Renamed from
            `leftDatasetId` when the right side became polymorphic.
        leftColumn:
          type: string
          minLength: 1
          description: The join key on the left source.
        rightSourceId:
          type: string
          pattern: '^ds_[0-9a-f]{8}$'
          description: |
            The RIGHT source joined in by this edge — a **dataset** (`ds_…`).
            R167 NARROWED this from the polymorphic `^(ds_|qr_)…`: R91 had widened it
            so a saved Query could be joined in on the right (`query×query`), which the
            closed Query concept refuses — every operand of a join is a dataset
            (`_noun-model.md` § D5). Every surface that offered it was withdrawn at
            R166; this is the wire catching up. The name stays `rightSourceId` (not
            `rightDatasetId`) because renaming a shipped field buys nothing here.
        rightColumn:
          type: string
          minLength: 1
          description: |
            The join key on the right source. For a `qr_` right side it names one of
            the joined-in query's EFFECTIVE (collision-qualified) column names.
        cardinality:
          type: string
          enum: [one_to_one, one_to_many, many_to_one, many_to_many]
          description: Declared multiplicity (mirrors the governed Relationship).
        originRelationshipId:
          type: [string, 'null']
          pattern: '^rel_[0-9a-f]{8}$'
          description: |
            Provenance back-ref to the governed Relationship this was copied from
            (copy-on-pick). Null/omitted when defined free-form (R89). On divergence
            (the governed rel later changes or is removed) the builder WARNS only —
            the query keeps its copy; re-syncing is the user's choice (R89).
          examples: ['rel_4d7b91ce']

    AggregateStep:
      type: object
      description: |
        R120 — a TRANSFORM STEP that aggregates the query's resolved rows
        server-side: `GROUP BY (dimensions) → measures`, the same shape the R119
        `POST /queries/{id}/aggregate` endpoint carries, but SAVED on the query as
        reusable shaping (the first "workflow" step). Columns are by EFFECTIVE
        name. After this step the query's effective columns become the grouped
        output (dimensions then measures), reflected in `Query.resolvedColumns`.
        v1 scope: a query carries at most ONE step, kind `aggregate` (chaining of
        ≥2 typed steps is a later round).
      required: [kind, dimensions, measures]
      additionalProperties: false
      properties:
        kind:
          const: aggregate
          description: The step discriminator. v1 supports only `aggregate`.
        dimensions:
          type: array
          description: GROUP BY columns by effective name (empty = a scalar, one row).
          items:
            type: string
            minLength: 1
        measures:
          type: array
          minItems: 1
          description: The aggregates to compute, in output order.
          items:
            type: object
            required: [agg]
            additionalProperties: false
            properties:
              col:
                type: string
                minLength: 1
                description: |
                  Column to aggregate (effective name). Required for every agg
                  except `count` (which tallies rows and omits it). R140 dtype
                  rules — `sum`/`avg`: numeric; `min`/`max`: numeric or
                  date/datetime; `count_distinct`: any.
              agg:
                type: string
                enum: [sum, count, avg, min, max, count_distinct]

    TopNStep:
      type: object
      description: |
        R121 — a TRANSFORM STEP that orders the rows by a column and keeps the
        first `n` (the canonical post-aggregate "top N by measure"). `col` is by
        effective name (the column space AFTER any prior step); the column space
        is unchanged by this step. Compiles to `ORDER BY col [DESC] LIMIT n`.
      required: [kind, col, n]
      additionalProperties: false
      properties:
        kind:
          const: top_n
        col:
          type: string
          minLength: 1
          description: Column to order by (effective name, post prior steps).
        n:
          type: integer
          minimum: 1
          description: Keep the first `n` rows after ordering.
        descending:
          type: boolean
          default: false
          description: Order descending (largest first) when true; ascending otherwise.

    DeriveStep:
      type: object
      description: |
        R122 — a TRANSFORM STEP that adds a new column from a FORMULA-FREE binary
        op: `name = left <op> right`. `left` is an existing numeric column (by
        effective name); `right` is another numeric column or a literal number;
        `op` is one of `+ - * /`. NOT a formula string — a structured op (the
        product's no-formula rule). Compound expressions chain multiple `derive`
        steps. `÷` by zero yields NULL (guarded). The output column is `float`.
      required: [kind, name, left, op, right]
      additionalProperties: false
      properties:
        kind:
          const: derive
        name:
          type: string
          minLength: 1
          description: New column name; must not collide with an existing column.
        left:
          type: string
          minLength: 1
          description: Left operand — an existing numeric column (effective name).
        op:
          type: string
          enum: ['+', '-', '*', '/']
        right:
          description: Right operand — a numeric column OR a literal number.
          oneOf:
            - type: object
              required: [kind, col]
              additionalProperties: false
              properties:
                kind:
                  const: col
                col:
                  type: string
                  minLength: 1
            - type: object
              required: [kind, value]
              additionalProperties: false
              properties:
                kind:
                  const: const
                value:
                  type: number

    ComputeStep:
      type: object
      description: |
        R184 — a TRANSFORM STEP that adds a new column by applying ONE function
        from a CLOSED CATALOG to an existing column, row by row:
        `name = fn(col)`. Not a formula string (the product's no-formula rule):
        `fn` is an enum, and the catalog grows only when a round pulls a new
        function in. The source column is never changed (append-only, like
        `derive` / `case`); use `select` to rename or drop.

        Catalog:
        - `trim` — the text with leading and trailing whitespace removed,
          including the non-breaking space (U+00A0) that spreadsheet exports
          carry; inner spaces are kept. `col` must be a `string` column; the
          output is `string`; a blank / NULL cell stays NULL. Makes values that
          differ only by edge whitespace group as one.
      required: [kind, name, fn, col]
      additionalProperties: false
      properties:
        kind:
          const: compute
        name:
          type: string
          minLength: 1
          description: New column name; must not collide with an existing column (`column_exists`).
        fn:
          type: string
          enum: [trim]
          description: A function of the catalog; anything else is a 422 from the request
            validator (the engine's own guard for the same rule is `unknown_function`).
        col:
          type: string
          minLength: 1
          description: |
            The input column (effective name at this step). It must exist here
            (`unknown_column` otherwise) and have the function's input dtype
            (`wrong_dtype` otherwise — `trim` needs a `string`).

    FilterStepPredicate:
      type: object
      description: |
        R123 — one predicate of a filter STEP, referencing a column BY effective
        NAME (the column space at this step). Same operator vocabulary + operand
        fields as a source `FilterAtom`, but name-keyed (not the source index) and
        with no `dtype` (the BE looks it up from the current columns). `op` validity
        is dtype-dependent and re-checked on save/run.
      required: [col, op]
      additionalProperties: false
      properties:
        col:
          type: string
          minLength: 1
          description: Column to test, by effective name (post prior steps).
        op:
          type: string
          description: Operator key (validity is dtype-dependent, like `FilterAtom.op`).
        val:
          $ref: '#/components/schemas/Operand'
        min:
          $ref: '#/components/schemas/Operand'
        max:
          $ref: '#/components/schemas/Operand'
        vals:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Operand'
          description: R176 — value list for `in` / `not_in` (see `FilterAtom.vals`).
        refCol:
          type: string
          minLength: 1
          description: |
            R176 — compare against another column at this step, by effective NAME,
            instead of a literal `val` (see `FilterAtom.refCol`).

    FilterStep:
      type: object
      description: |
        R123 — keep rows matching ALL `predicates` (implicit AND) over the CURRENT
        column space — a post-aggregate / post-derive `WHERE` (HAVING-like). Distinct
        from `QueryDefinition.filters`, which filter the SOURCE rows before any step.
        The column space is unchanged.
      required: [kind, predicates]
      additionalProperties: false
      properties:
        kind:
          const: filter
        predicates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterStepPredicate'

    SortStep:
      type: object
      description: |
        R141 — a TRANSFORM STEP that orders the rows by one or more keys (a
        `top_n` without the limit — deliverable ordering). Each key's `col` is by
        effective name (the column space AFTER any prior step), ANY dtype (strings
        sort lexically); later keys tie-break earlier ones. Two chained sorts do
        NOT compose into multi-key (the later one wins) — use `keys`. The column
        space is unchanged. Compiles to `ORDER BY k1 [DESC], k2 [DESC], …` with
        explicit NULLS LAST in BOTH directions (blanks stay at the bottom of a
        deliverable, deterministically). Order is an OUTPUT property: meaningful
        when `sort` is the last reshaping step — a following `aggregate` discards
        it.
      required: [kind, keys]
      additionalProperties: false
      properties:
        kind:
          const: sort
        keys:
          type: array
          minItems: 1
          description: Ordering keys, majoring first; later keys tie-break.
          items:
            type: object
            required: [col]
            additionalProperties: false
            properties:
              col:
                type: string
                minLength: 1
                description: Column to order by (effective name, post prior steps).
              descending:
                type: boolean
                default: false
                description: Largest first when true; ascending otherwise. NULLs last either way.

    SelectStep:
      type: object
      description: |
        R141 — a TRANSFORM STEP doing projection + rename + reorder in ONE body:
        the output is EXACTLY the `cols` entries in THIS order, each keeping its
        source dtype, named `name ?? col` (`name` — the same rename vocabulary as
        `DeriveStep.name`). Every `col` must exist at this step (`unknown_column`
        otherwise); output names must be unique (`duplicate_output_column`). A
        rename is a real RE-BINDING, not a display alias — later steps and
        `resolvedColumns` see the NEW names/order (so `count_distinct(product)`'s
        output col `product` becomes `distinct_products` via a following select).
      required: [kind, cols]
      additionalProperties: false
      properties:
        kind:
          const: select
        cols:
          type: array
          minItems: 1
          description: The output columns, in output order.
          items:
            type: object
            required: [col]
            additionalProperties: false
            properties:
              col:
                type: string
                minLength: 1
                description: Source column (effective name, post prior steps).
              name:
                type: string
                minLength: 1
                description: Output name; omitted = keep `col`'s name.

    DateBucketStep:
      type: object
      description: |
        R144 — a TRANSFORM STEP that APPENDS a new `date` column holding `col`
        truncated to `granularity` (the time axis of a report). `col` is by
        effective name (the column space AFTER any prior step) and must be
        dtype `date` or `datetime` at that step (`bucket_col_not_date`
        otherwise); `name` follows the `DeriveStep.name` rename vocabulary
        (collision → `column_exists`). The output value is the PERIOD'S START
        DATE (month → its 1st; week → its MONDAY — ISO-8601 Monday-start, the
        product's week convention, human-decided R144) — a sortable data
        value, not a display label (week/month labels are presentation).
        Compiles to `CAST(date_trunc('<granularity>', col) AS DATE)`. The
        column space folds like `derive`: base ++ the new `date` column; the
        source column stays available to later steps.
      required: [kind, col, granularity, name]
      additionalProperties: false
      properties:
        kind:
          const: date_bucket
        col:
          type: string
          minLength: 1
          description: Column to bucket (effective name, post prior steps); must be date/datetime.
        granularity:
          type: string
          enum: [day, week, month, quarter, year]
          description: Truncation unit; week is ISO-8601 Monday-start.
        name:
          type: string
          minLength: 1
          description: The appended output column's name (must not collide).

    DatePartStep:
      type: object
      description: |
        R175 — a TRANSFORM STEP that APPENDS an `integer` column holding one
        calendar PART of `col` (the companion of `date_bucket`: a bucket keeps a
        date, a part is a number you can compare or subtract). `col` must be
        `date`/`datetime` at this step (`part_col_not_date`); `name` follows the
        `DeriveStep.name` vocabulary (`column_exists`). Parts: `year`, `quarter`
        (1–4), `month` (1–12), `week` (ISO-8601 week number), `day` (day of
        month), `dow` (ISO day of week, Monday = 1 … Sunday = 7). NULL in → NULL
        out. Compiles to `CAST(date_part('<part>', col) AS BIGINT)` (`isodow` for
        `dow`). Pulled by the weekly report: vehicle age = lead year − model year,
        and "same period last month" = day-of-month ≤ the cut-off day.
      required: [kind, col, part, name]
      additionalProperties: false
      properties:
        kind:
          const: date_part
        col:
          type: string
          minLength: 1
          description: Column to read (effective name, post prior steps); must be date/datetime.
        part:
          type: string
          enum: [year, quarter, month, week, day, dow]
          description: The calendar part to extract; week is ISO-8601, dow is ISO (Mon=1).
        name:
          type: string
          minLength: 1
          description: The appended output column's name (must not collide).

    DateDiffStep:
      type: object
      description: |
        R175 — a TRANSFORM STEP that APPENDS an `integer` column: the number of
        `unit` BOUNDARIES crossed going from `start` to `end` (calendar
        difference, DuckDB `datediff`): `2026-08-31 → 2026-09-01` is 1 month,
        `2026-09-01 → 2026-09-30` is 0. Negative when `end` is earlier; NULL if
        either side is NULL. Both columns must be `date`/`datetime`
        (`diff_col_not_date`). This is how a report says "this month vs last
        month" without a hard-coded date: `datediff(month, lead month, cut-off)`
        is 0 for the current month and 1 for the previous one, whatever the
        export date. `name` follows the `DeriveStep.name` vocabulary.
      required: [kind, start, end, unit, name]
      additionalProperties: false
      properties:
        kind:
          const: date_diff
        start:
          type: string
          minLength: 1
          description: The earlier column (effective name); date/datetime.
        end:
          type: string
          minLength: 1
          description: The later column (effective name); date/datetime.
        unit:
          type: string
          enum: [day, week, month, quarter, year]
          description: The calendar unit whose boundaries are counted.
        name:
          type: string
          minLength: 1
          description: The appended output column's name (must not collide).

    CaseValue:
      type: object
      description: |
        R175 — the value a `case` branch (or its `otherwise`) yields: a LITERAL
        (`{kind: const, value}` — a string or a number) or another COLUMN at this
        step (`{kind: col, col}`). Same `kind` discriminator as a derive operand.
      oneOf:
        - type: object
          required: [kind, value]
          additionalProperties: false
          properties:
            kind:
              const: const
            value:
              type: [string, number]
        - type: object
          required: [kind, col]
          additionalProperties: false
          properties:
            kind:
              const: col
            col:
              type: string
              minLength: 1

    CaseBranch:
      type: object
      description: |
        R175 — one WHEN … THEN arm of a `case` step: `when` is an AND of
        predicates in the `FilterStep` vocabulary (by effective name, dtype-checked
        operator, `val`/`min`/`max` operands), `then` the value for a matching row.
      required: [when, then]
      additionalProperties: false
      properties:
        when:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilterStepPredicate'
        then:
          $ref: '#/components/schemas/CaseValue'

    CaseStep:
      type: object
      description: |
        R175 — the CONDITIONAL COLUMN: APPEND a column whose value is the `then`
        of the FIRST branch whose `when` matches the row, else `otherwise`
        (absent → NULL; the wire avoids the keyword `else`, the `SelectCol.name`
        precedent). Row count unchanged; the column space folds like `derive`. It is
        the product's formula-free IF/IFS: buckets (`GIÁ TRỊ XE < 500tr → "xe
        nhỏ"`), flags (`TRẠNG THÁI = "Thành công" → 1 else 0`, summed by a later
        `aggregate` into a conditional count), and fallbacks (`a` if it is in
        range else column `b`). Predicates reuse the filter vocabulary exactly, so
        an `in`-list is several branches with the same `then`.

        Output dtype is UNIFIED across every `then` and `otherwise`: all strings →
        `string`; all numbers → `integer` when every literal is whole and every
        column is integer, else `float`; columns of one temporal dtype keep it. A
        string mixed with a number (or any other disagreement) is
        `case_type_mismatch` (422). At most 20 branches (`too_many_branches`).
      required: [kind, name, branches]
      additionalProperties: false
      properties:
        kind:
          const: case
        name:
          type: string
          minLength: 1
          description: The appended output column's name (must not collide → `column_exists`).
        branches:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CaseBranch'
        otherwise:
          $ref: '#/components/schemas/CaseValue'

    GroupColumnStep:
      type: object
      description: |
        R162/R163 — the WITHIN-GROUP column: APPEND a column whose value is an
        aggregate over the group of rows THIS row belongs to. The row count is
        UNCHANGED — the non-collapsing half of the aggregate family, and the
        reason `query⋈query` was ever reached for (compare a row to its group).
        `agg`/`col` reuse the collapsing measure's EXACT vocabulary and dtype
        rules (`sum`/`avg` numeric; `min`/`max` numeric or date/datetime;
        `count_distinct` any; `count` omits `col` and tallies the group's ROWS),
        validated by the same `_validate_measure`. Output dtype mirrors an
        aggregate measure: `avg` → float, `count`/`count_distinct` → integer,
        `sum`/`min`/`max` keep the col's dtype; `sum`/`avg` coalesce an all-NULL
        group to 0, `min`/`max` stay NULL. The column space folds like `derive`
        (base ++ the new column; the source column stays available).

        Compiles to `SELECT *, <expr> OVER (PARTITION BY <by…>) AS name FROM
        (prev)` — there is NO in-window `ORDER BY`, so the frame is the whole
        partition and the result is order-independent. Running total / rank /
        vs-prior-period need an in-window ORDER BY + frame; that is why they are
        a separate step family, not a widening of this one.

        POSITION carries the meaning (the ordered-operations rule): placed
        BEFORE a collapsing `aggregate` it averages the underlying ROWS
        (pooled); placed AFTER, it averages the already-grouped VALUES. Both are
        correct answers to different questions, so there is deliberately no
        `basis` parameter — see
        .agents/design/data-management/queries/query-construction.md.
      required: [kind, name, agg, by]
      additionalProperties: false
      properties:
        kind:
          const: group_column
        name:
          type: string
          minLength: 1
          description: The appended output column's name (must not collide → `column_exists`).
        agg:
          type: string
          enum: [sum, count, avg, min, max, count_distinct]
          description: The aggregate, same vocabulary as a collapsing measure.
        col:
          type: string
          minLength: 1
          description: |
            Column to aggregate (effective name, post prior steps). Required for
            every agg except `count` (which tallies the group's rows and omits it).
        by:
          type: array
          description: |
            The group columns (PARTITION BY), by effective name at this step.
            Unknown → `unknown_column`; a repeat → `duplicate_group_column`.
            R175 — an EMPTY `by` is the WHOLE TABLE (`OVER ()`): the builder
            names it "Across everything", the same explicit state the
            `window_column` family already renders, so it is never a silent
            global window. Pulled by the weekly report: the data's cut-off
            (latest lead date / its day of month) compared on every row.
          items:
            type: string
            minLength: 1

    WindowColumnStep:
      type: object
      description: |
        R164 — the ORDERED-WINDOW column: the same APPEND-a-column shape as
        `GroupColumnStep`, plus the thing that step withholds — an in-window
        `ORDER BY` and a frame. Row count UNCHANGED; the column space folds like
        `derive` (base ++ the new column; sources stay available).

        ONE kind, four business operations, chosen by `op`. The user never meets
        this kind name: `[Add step ▾]` offers the four OPERATIONS as separate
        entries, so a player looks for "running total", not for a category that
        contains it (see
        .agents/design/data-management/queries/query-construction.md).

        Each `op` fixes which optional fields are REQUIRED and which are
        REJECTED. A supplied-but-meaningless field is a 422, never silently
        ignored — a silently-dropped control is how a user gets a column that
        disregards a setting they made:

        | op            | col              | orderBy                  | unit     |
        | ------------- | ---------------- | ------------------------ | -------- |
        | pct_of_total  | required numeric | rejected                 | rejected |
        | running_total | required numeric | >=1 key, any dtype       | rejected |
        | rank          | rejected         | >=1 key, any dtype       | rejected |
        | prior_period  | required any     | exactly 1, date/datetime | required |

        `prior_period` walks the CALENDAR, not the rows: it compiles to
        `RANGE BETWEEN INTERVAL 1 <unit> PRECEDING AND INTERVAL 1 <unit>
        PRECEDING`, so on a Jan/Feb/APR axis April reads NULL rather than
        silently reporting February's value (a positional `LAG` does the latter).
        It emits the previous period's VALUE, not a delta or a % change — the
        comparison is one `derive` away, and `derive` is already the formula-free
        binary op. A month-over-month tile is therefore TWO steps.

        `rank` is `RANK` only: ties share a rank and the next rank skips.
        `ROW_NUMBER` is refused on correctness grounds — it invents an order
        between genuinely equal rows, so the same query can reshuffle a tie
        between runs.

        Output dtypes: `pct_of_total` -> `float` (a RATIO in 0..1 — percent
        FORMATTING is presentation and belongs to the widget, which is why the
        control is labelled "Share of total" and not "% of total");
        `rank` -> `integer`; `running_total` / `prior_period` keep the col's dtype.
      required: [kind, op, name, by]
      additionalProperties: false
      properties:
        kind:
          const: window_column
        op:
          type: string
          enum: [pct_of_total, running_total, rank, prior_period]
          description: The business operation; fixes which other fields are required/rejected.
        name:
          type: string
          minLength: 1
          description: |
            The appended output column's name (must not collide -> `column_exists`).
            The builder DEFAULTS it from the op (`<col>_share`, `<col>_running`,
            `rank`, `prev_<col>`) so a blank card never starts with a name that
            makes no claim — a default, not a rule.
        col:
          type: string
          minLength: 1
          description: |
            The value column (effective name, post prior steps). Required for every
            op but `rank`, which REJECTS it (`window_col_forbidden`).
            `pct_of_total`/`running_total` need it numeric.
        by:
          type: array
          minItems: 0
          description: |
            The partition (PARTITION BY), by effective name at this step. MAY be
            EMPTY here — unlike `group_column` — because the builder renders the
            empty case as an explicit "Across everything" state. That guard exists
            against a SILENT whole-table window, and a named state is not silent.
            Unknown -> `unknown_column`; a repeat -> `duplicate_group_column`.
          items:
            type: string
            minLength: 1
        orderBy:
          type: array
          minItems: 1
          description: |
            The in-window ordering — deliberately the SAME shape as `SortStep.keys`,
            so ordering has one vocabulary in this domain. Rejected by
            `pct_of_total` (`window_order_forbidden`); exactly one key, on a
            date/datetime column, ascending, for `prior_period`.
          items:
            type: object
            required: [col]
            additionalProperties: false
            properties:
              col:
                type: string
                minLength: 1
              descending:
                type: boolean
                default: false
        unit:
          type: string
          enum: [day, week, month, quarter, year]
          description: |
            The period length — `prior_period` only (rejected otherwise ->
            `window_unit_forbidden`). Reuses `DateBucketStep.granularity`'s enum
            VERBATIM: one period vocabulary, two steps, and `date_bucket` is the
            producer of the axis this op walks.

    QueryDefinition:
      type: object
      description: |
        The saved predicate state — exactly what the dataset detail page
        serializes from its URL: the chip filters, the advanced-query
        DNF, and the `?q=` row search. Re-run verbatim on open. R71 added an
        optional join; R73 generalizes it to `joins`, an ORDERED list of hops,
        and R74 relaxes their topology to a connected acyclic TREE: when non-empty
        the Query is multi-source and a FilterAtom's `col` indexes the EFFECTIVE
        column space (the ordered concatenation across the source dataset ++ every
        joined dataset), not a single dataset. (A single join is just a length-1
        list. The backend normalizes any legacy single `join` to a length-1
        `joins` on read, so responses always carry `joins`.)

        R120 — an optional ordered `steps` list applies TRANSFORMS after the
        source/join/filter resolve (the "workflow" direction): saved, reusable
        shaping. Empty/omitted = a plain select query (unchanged). A query with a
        step exposes its POST-step columns as `resolvedColumns`.
      required: [filters, advanced]
      additionalProperties: false
      properties:
        params:
          type: array
          maxItems: 8
          description: |
            R194 (dashboard-filters.md D1) — the typed parameters this query
            declares; operands use them as `{"param": "<name>"}` (D2 places only).
            Omitted when none. Save-time checks (422 naming the field): a reference
            to an undeclared name, a type that does not fit the column (date ⇄
            date/datetime, number ⇄ integer/float, string ⇄ string), a reference on
            an operator without an operand, a reference beside `refCol`, a default
            that is not of the type. A declared but unused parameter is allowed.
          items:
            $ref: '#/components/schemas/QueryParam'
        q:
          type: [string, 'null']
          description: |
            The `?q=` case-insensitive substring search, if the saved
            view had one. Null / omitted when no search was active.
          maxLength: 200
        filters:
          type: array
          description: |
            Chip filters — implicit AND across atoms (dataset-filters.md).
            At most one predicate per column, mirroring `f<N>_*`.
          items:
            $ref: '#/components/schemas/FilterAtom'
        advanced:
          type: array
          description: |
            Advanced query in disjunctive normal form — an OR of AND-groups
            (advanced-query.md). Outer array ORs its groups; each inner
            array ANDs its atoms. Empty when no advanced query was active.
          items:
            type: array
            items:
              $ref: '#/components/schemas/FilterAtom'
        relationships:
          type: array
          description: |
            R88 — the query's OWN join relationships (query-owned rels). Each
            `JoinStep` references one by `queryRelId`. Empty / omitted for a
            single-source Query. Seeded by COPY-ON-PICK from governed `rel_`s
            (provenance recorded in `originRelationshipId`) or defined free-form
            (R89). The query runs on these copies, so it never breaks when a
            governed rel changes (query-owned-relationships brainstorm).
          items:
            $ref: '#/components/schemas/QueryRelationship'
        joins:
          type: array
          description: |
            R73/R74 — an ordered list of join hops forming a connected acyclic
            TREE. Empty / omitted for a single-source Query; one hop reads two
            datasets as one (R71); more join additional datasets
            (`Deals ⋈ Accounts ⋈ Owners`). Each hop's left/driving dataset is ANY
            dataset already in the graph (R74; R73 fixed it to the previous tail —
            a linear path is the degenerate tree), its right is a dataset not yet
            joined (acyclic). Hops are stored in topological order; validated on
            save (`disconnected_join` / `cyclic_join`). R88 — each hop references a
            query-owned `relationships[]` entry via `queryRelId` (was a governed
            `relationshipId`).
          items:
            $ref: '#/components/schemas/JoinStep'
        steps:
          type: array
          description: |
            An ordered list of TRANSFORM steps applied AFTER the source/join/filter
            resolve (saved shaping — the "workflow" direction). Empty/omitted for a
            plain select query. R120 added the `aggregate` step; R121 makes steps
            CHAIN (a typed engine threads a typed relation through each, stringifying
            only the final output) and adds `top_n`; R141 adds the deliverable-shaping
            `sort` + `select`; R144 the `date_bucket` time axis; R163 the
            non-collapsing `group_column` (the within-group column); R164 the ordered-window
            family (`window_column`: share of total / running total / rank / previous
            period's value); R175 the formula-free `case` (conditional column), the
            numeric `date_part` and the calendar `date_diff`; R184 `compute` (one
            function from a closed catalog — `trim` first). At most 24 steps (`too_many_steps`; R175 raised
            it from 8 — a real weekly funnel needs ~20). A query with
            steps exposes its POST-step columns as `resolvedColumns`.
            `kind`-discriminated union.
          items:
            oneOf:
              - $ref: '#/components/schemas/AggregateStep'
              - $ref: '#/components/schemas/TopNStep'
              - $ref: '#/components/schemas/DeriveStep'
              - $ref: '#/components/schemas/FilterStep'
              - $ref: '#/components/schemas/SortStep'
              - $ref: '#/components/schemas/SelectStep'
              - $ref: '#/components/schemas/DateBucketStep'
              - $ref: '#/components/schemas/GroupColumnStep'
              - $ref: '#/components/schemas/WindowColumnStep'
              - $ref: '#/components/schemas/DatePartStep'
              - $ref: '#/components/schemas/CaseStep'
              - $ref: '#/components/schemas/DateDiffStep'
              - $ref: '#/components/schemas/ComputeStep'
            discriminator:
              propertyName: kind
              mapping:
                aggregate: '#/components/schemas/AggregateStep'
                top_n: '#/components/schemas/TopNStep'
                derive: '#/components/schemas/DeriveStep'
                filter: '#/components/schemas/FilterStep'
                sort: '#/components/schemas/SortStep'
                select: '#/components/schemas/SelectStep'
                date_bucket: '#/components/schemas/DateBucketStep'
                group_column: '#/components/schemas/GroupColumnStep'
                window_column: '#/components/schemas/WindowColumnStep'
                date_part: '#/components/schemas/DatePartStep'
                case: '#/components/schemas/CaseStep'
                date_diff: '#/components/schemas/DateDiffStep'
                compute: '#/components/schemas/ComputeStep'

    Query:
      type: object
      required: [id, workspaceId, sourceId, name, definition, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^qr_[0-9a-f]{8}$'
          description: Server-generated. Format `qr_<8 lowercase hex>`.
          examples: ['qr_9c2f10ab']
        workspaceId:
          type: string
          pattern: '^ws_[0-9a-f]{8}$'
          description: Foreign key to the containing workspace (the IA scope).
        sourceId:
          type: string
          pattern: '^ds_[0-9a-f]{8}$'
          description: |
            The DRIVING source — the single, canonical source-of-record field
            (R79 completed the `datasetId → sourceId` rename R76 designed). Always a
            **Dataset** (`ds_…`): R167 narrowed this from the polymorphic
            `^(ds_|qr_)…`, retiring the COMPOSED form in which a Query was built on
            another Query. A Query is a live table over datasets only
            (`_noun-model.md`, concept locked R161); the variant need composition
            served is met by **Duplicate** (R166). On delete of the source dataset its
            queries cascade away (app-level — the column carries no FK).
          examples: ['ds_71a4e2f0']
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            User-supplied at save time. Unique per workspace (mirrors the
            dataset name-uniqueness rule).
          examples: ['Won deals over $1k (2026)']
        definition:
          $ref: '#/components/schemas/QueryDefinition'
        resolvedColumns:
          type: array
          description: |
            R71 — the Query's EFFECTIVE columns, server-computed and present
            whenever `definition.joins` is non-empty. It is the ordered
            concatenation across the source dataset ++ every chained dataset
            (`Deals.columns ++ Accounts.columns ++ Owners.columns`), with names
            that collide across sources qualified by dataset (`Deals.id` /
            `Accounts.id`; `accounts.tier` / `owners.tier`). The FE needs this
            to render the joined result's headers (it cannot derive them from
            one source dataset). Omitted for a single-source query (its columns
            are the source dataset's). See multi-join.md § Data contract.

            R93 — each item also carries its COLUMN PROVENANCE: the leaf dataset
            (`ownerSourceId`) and pre-qualification name (`sourceColumn`) the
            effective column traces to. This lets a consumer (the canvas) join
            OFF a query's effective column — the hop's left key resolves to the
            owning leaf `ds_`, which the join resolver matches by membership. A
            column that traces 1:1 to a single leaf carries both fields; a
            derived/aggregate column (no single owner) omits them.
          items:
            type: object
            required: [name, dtype]
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              dtype:
                type: string
                enum: [string, integer, float, boolean, date, datetime]
              ownerSourceId:
                type: string
                pattern: '^ds_[0-9a-f]{8}$'
                description: |
                  R93 — the LEAF dataset that owns this effective column (always
                  a `ds_`, never a `qr_`; it matches the join resolver's
                  leaf-membership left-match). Present for a 1:1-owned column;
                  omitted for a derived/aggregate column.
              sourceColumn:
                type: string
                minLength: 1
                description: |
                  R93 — the column's PRE-qualification name on its owning leaf
                  (`id`, not the collision-qualified display `Deals.id`). The
                  join key uses this; `name` stays the display/header.
        createdAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          description: ISO-8601 UTC, `Z`-suffixed. Server-stamped at save time.
          examples: ['2026-06-12T14:02:00Z']

    AggregateRequest:
      type: object
      description: |
        R119 — the body of `POST /queries/{id}/aggregate`. Describes a
        server-side GROUP BY over a saved query's resolved rows. Columns are
        referenced BY effective NAME (the consumer — a dashboard widget —
        thinks in column names, e.g. `dimensionCol` / `measureCol`), not by
        the 0-based index a `FilterAtom` uses. SCOPE (R119): 0-or-1
        `dimensions` + 1 `measures`; `filters` are the runtime dashboard
        filters (R103) pushed server-side.
      required: [dimensions, measures]
      additionalProperties: false
      properties:
        dimensions:
          type: array
          description: |
            The GROUP BY columns, by effective name, in output order. Empty
            for a scalar KPI (one row over the whole result). R119 scope:
            0 or 1.
          items:
            type: string
            minLength: 1
        measures:
          type: array
          minItems: 1
          description: |
            The aggregates to compute, in output order. R119 scope: exactly 1.
          items:
            type: object
            required: [agg]
            additionalProperties: false
            properties:
              col:
                type: string
                minLength: 1
                description: |
                  The column to aggregate, by effective name. REQUIRED for
                  every agg except `count` (which tallies rows and omits it).
                  R140 dtype rules — `sum`/`avg`: numeric; `min`/`max`:
                  numeric or date/datetime; `count_distinct`: any.
              agg:
                type: string
                enum: [sum, count, avg, min, max, count_distinct]
        filters:
          type: array
          description: |
            R103 runtime dashboard filters, pushed server-side so an
            aggregated widget honours an active filter. Each is a categorical
            one-of on an effective column BY NAME: keep rows whose `column`
            cell equals one of `values`. AND-composed across filters; a
            `null` value matches a NULL/empty cell (the `(blank)` option).
            Empty / omitted when no dashboard filter is active.
          default: []
          items:
            type: object
            required: [column, values]
            additionalProperties: false
            properties:
              column:
                type: string
                minLength: 1
              values:
                type: array
                items:
                  type: [string, 'null']

        params:
          $ref: '#/components/schemas/ParamValues'
        dashboardParams:
          $ref: '#/components/schemas/DashboardParamValues'
