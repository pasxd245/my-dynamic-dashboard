# Shared schema: Query (R69 — Saved Query MVP)
# Used by: queries/post (response), queries/get (response items),
#          queries/detail-get (response).
# Matches the data model in .agents/design/data-management/datasets/saved-query.md
# and the backend Query SQLModel entity.
#
# A Query is a named, saved definition that produces a virtual dataset by
# re-running a set of predicates against ONE source Dataset (D-4). The
# `definition` reuses the EXACT predicate-atom shape the rows-GET endpoint
# already transports (`f<N>_*` chip filters + the `aq` DNF) — no new query
# vocabulary, just persistence.
components:
  schemas:
    FilterAtom:
      type: object
      description: |
        One predicate atom — the same object shape carried by the
        rows-GET `aq` param (see datasets/rows-get.contract.yaml § aq).
        `col` is the 0-based index into the source Dataset.columns[];
        `dtype` must equal that column's dtype; `op` + operand fields
        (`val` / `min` / `max`) follow the per-dtype vocabulary in
        .agents/design/data-management/dataset-filters.md.
      required: [col, dtype, op]
      additionalProperties: false
      properties:
        col:
          type: integer
          minimum: 0
          description: 0-based index into the source Dataset.columns[].
        dtype:
          type: string
          enum: [string, integer, float, boolean, date, datetime]
          description: Must equal the dtype of Dataset.columns[col].
        op:
          type: string
          description: |
            Operator key. Validity is dtype-dependent (not a static
            enum) and re-checked by the BE on save and on run, exactly
            as the rows-GET `aq` atoms are checked.
        val:
          type: [string, number]
          description: Single-operand value (ops that take one value).
        min:
          type: [string, number]
          description: Lower bound for `between` (inclusive).
        max:
          type: [string, number]
          description: Upper bound for `between` (inclusive).

    JoinStep:
      type: object
      description: |
        R71 — an optional join step on a QueryDefinition. When present, the
        Query reads TWO related datasets as one virtual table by consuming a
        governed Relationship (the `rel_` edge). The join keys + the two
        datasets come from the Relationship; only the join `type` is a
        query-time choice. See .agents/design/data-management/queries/joins.md.
      required: [relationshipId, type]
      additionalProperties: false
      properties:
        relationshipId:
          type: string
          pattern: "^rel_[0-9a-f]{8}$"
          description: |
            The governed edge this join consumes (its left/right datasets +
            validated key pair are the join's sources + ON clause). Must be a
            valid (non-stale), in-workspace Relationship at save time.
          examples: ["rel_4d7b91ce"]
        type:
          type: string
          enum: [inner]
          description: |
            MVP — inner join only. left/right/outer joins are deferred
            (joins.md § Scope).

    QueryDefinition:
      type: object
      description: |
        The saved predicate state — exactly what the dataset detail page
        serializes from its URL: the chip filters, the advanced-query
        DNF, and the `?q=` row search. Re-run verbatim on open. R71 adds an
        optional `join` step: when present, the Query is multi-source and a
        FilterAtom's `col` indexes the EFFECTIVE column space (left ++ right),
        not a single dataset.
      required: [filters, advanced]
      additionalProperties: false
      properties:
        q:
          type: [string, "null"]
          description: |
            The `?q=` case-insensitive substring search, if the saved
            view had one. Null / omitted when no search was active.
          maxLength: 200
        filters:
          type: array
          description: |
            Chip filters — implicit AND across atoms (dataset-filters.md).
            At most one predicate per column, mirroring `f<N>_*`.
          items:
            $ref: "#/components/schemas/FilterAtom"
        advanced:
          type: array
          description: |
            Advanced query in disjunctive normal form — an OR of AND-groups
            (advanced-query.md). Outer array ORs its groups; each inner
            array ANDs its atoms. Empty when no advanced query was active.
          items:
            type: array
            items:
              $ref: "#/components/schemas/FilterAtom"
        join:
          $ref: "#/components/schemas/JoinStep"

    Query:
      type: object
      required: [id, workspaceId, datasetId, name, definition, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^qr_[0-9a-f]{8}$"
          description: Server-generated. Format `qr_<8 lowercase hex>`.
          examples: ["qr_9c2f10ab"]
        workspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
          description: Foreign key to the containing workspace (the IA scope).
        datasetId:
          type: string
          pattern: "^ds_[0-9a-f]{8}$"
          description: |
            Foreign key to the single source dataset (D-4). On delete of
            the dataset, its queries cascade away.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            User-supplied at save time. Unique per workspace (mirrors the
            dataset name-uniqueness rule).
          examples: ["Won deals over $1k (2026)"]
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        resolvedColumns:
          type: array
          description: |
            R71 — the Query's EFFECTIVE columns, server-computed and present
            ONLY when `definition.join` is set. For a join it is the ordered
            concatenation `leftDataset.columns ++ rightDataset.columns`, with
            names that collide across the two sides qualified by dataset
            (`Deals.id` / `Accounts.id`). The FE needs this to render the
            joined result's headers (it cannot derive them from one source
            dataset). Omitted for a single-source query (its columns are the
            source dataset's). See joins.md § Data contract.
          items:
            type: object
            required: [name, dtype]
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              dtype:
                type: string
                enum: [string, integer, float, boolean, date, datetime]
        createdAt:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: ISO-8601 UTC, `Z`-suffixed. Server-stamped at save time.
          examples: ["2026-06-12T14:02:00Z"]
