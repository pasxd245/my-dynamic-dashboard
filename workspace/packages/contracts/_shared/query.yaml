# Shared schema: Query (R69 — Saved Query MVP)
# Used by: queries/post (response), queries/get (response items),
#          queries/detail-get (response).
# Matches the data model in .agents/design/data-management/datasets/saved-query.md
# and the backend Query SQLModel entity.
#
# A Query is a named, saved definition that produces a virtual dataset by
# re-running a set of predicates against ONE source Dataset (D-4). The
# `definition` reuses the EXACT predicate-atom shape the rows-GET endpoint
# already transports (`f<N>_*` chip filters + the `aq` DNF) — no new query
# vocabulary, just persistence.
components:
  schemas:
    FilterAtom:
      type: object
      description: |
        One predicate atom — the same object shape carried by the
        rows-GET `aq` param (see datasets/rows-get.contract.yaml § aq).
        `col` is the 0-based index into the source Dataset.columns[];
        `dtype` must equal that column's dtype; `op` + operand fields
        (`val` / `min` / `max`) follow the per-dtype vocabulary in
        .agents/design/data-management/dataset-filters.md.
      required: [col, dtype, op]
      additionalProperties: false
      properties:
        col:
          type: integer
          minimum: 0
          description: 0-based index into the source Dataset.columns[].
        dtype:
          type: string
          enum: [string, integer, float, boolean, date, datetime]
          description: Must equal the dtype of Dataset.columns[col].
        op:
          type: string
          description: |
            Operator key. Validity is dtype-dependent (not a static
            enum) and re-checked by the BE on save and on run, exactly
            as the rows-GET `aq` atoms are checked.
        val:
          type: [string, number]
          description: Single-operand value (ops that take one value).
        min:
          type: [string, number]
          description: Lower bound for `between` (inclusive).
        max:
          type: [string, number]
          description: Upper bound for `between` (inclusive).

    JoinStep:
      type: object
      description: |
        One join hop. R71 introduced a single hop; R73 chains an ordered LIST
        of them (`QueryDefinition.joins`). Each hop consumes a governed
        Relationship (the `rel_` edge) to read its right dataset as part of one
        virtual table; the join keys + datasets come from the Relationship, and
        only the join `type` is a query-time choice. R74 generalizes the topology
        from a linear chain to a connected acyclic TREE: each hop's LEFT/driving
        dataset is ANY dataset already in the graph (not just the tail), so one
        dataset may be joined to two or more others (a star). The hops are stored
        in topological order. See
        .agents/design/data-management/queries/multi-join.md.
      required: [relationshipId, type]
      additionalProperties: false
      properties:
        relationshipId:
          type: string
          pattern: "^rel_[0-9a-f]{8}$"
          description: |
            The governed edge this join consumes (its left/right datasets +
            validated key pair are the join's sources + ON clause). Must be a
            valid (non-stale), in-workspace Relationship at save time.
          examples: ["rel_4d7b91ce"]
        type:
          type: string
          enum: [inner, left, right, full]
          default: inner
          description: |
            The join type for this hop (R75). `inner` (default) keeps only matched
            rows; `left` keeps all left/driving rows (unmatched right = NULL);
            `right` keeps all right rows; `full` keeps all rows from both sides.
            A graph may mix types per hop. Composite keys / self-joins remain
            deferred (joins.md § Scope).

    QueryDefinition:
      type: object
      description: |
        The saved predicate state — exactly what the dataset detail page
        serializes from its URL: the chip filters, the advanced-query
        DNF, and the `?q=` row search. Re-run verbatim on open. R71 added an
        optional join; R73 generalizes it to `joins`, an ORDERED list of hops,
        and R74 relaxes their topology to a connected acyclic TREE: when non-empty
        the Query is multi-source and a FilterAtom's `col` indexes the EFFECTIVE
        column space (the ordered concatenation across the source dataset ++ every
        joined dataset), not a single dataset. (A single join is just a length-1
        list. The backend normalizes any legacy single `join` to a length-1
        `joins` on read, so responses always carry `joins`.)
      required: [filters, advanced]
      additionalProperties: false
      properties:
        q:
          type: [string, "null"]
          description: |
            The `?q=` case-insensitive substring search, if the saved
            view had one. Null / omitted when no search was active.
          maxLength: 200
        filters:
          type: array
          description: |
            Chip filters — implicit AND across atoms (dataset-filters.md).
            At most one predicate per column, mirroring `f<N>_*`.
          items:
            $ref: "#/components/schemas/FilterAtom"
        advanced:
          type: array
          description: |
            Advanced query in disjunctive normal form — an OR of AND-groups
            (advanced-query.md). Outer array ORs its groups; each inner
            array ANDs its atoms. Empty when no advanced query was active.
          items:
            type: array
            items:
              $ref: "#/components/schemas/FilterAtom"
        joins:
          type: array
          description: |
            R73/R74 — an ordered list of join hops forming a connected acyclic
            TREE. Empty / omitted for a single-source Query; one hop reads two
            datasets as one (R71); more join additional datasets
            (`Deals ⋈ Accounts ⋈ Owners`). Each hop's left/driving dataset is ANY
            dataset already in the graph (R74; R73 fixed it to the previous tail —
            a linear path is the degenerate tree), its right is a dataset not yet
            joined (acyclic). Hops are stored in topological order; validated on
            save (`disconnected_join` / `cyclic_join`). The free-form visual canvas
            is deferred → R75 (multi-join.md § Scope).
          items:
            $ref: "#/components/schemas/JoinStep"

    Query:
      type: object
      required: [id, workspaceId, datasetId, name, definition, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^qr_[0-9a-f]{8}$"
          description: Server-generated. Format `qr_<8 lowercase hex>`.
          examples: ["qr_9c2f10ab"]
        workspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
          description: Foreign key to the containing workspace (the IA scope).
        datasetId:
          type: string
          pattern: "^ds_[0-9a-f]{8}$"
          description: |
            Foreign key to the single source dataset (D-4). On delete of
            the dataset, its queries cascade away. R76 (composition): the
            DRIVING source is `sourceId` (below) — `datasetId` stays the
            `ds_` source for a dataset-rooted query (every R69→R75 query),
            and is the legacy field `sourceId` widens (its removal is a named
            cleanup once all queries carry `sourceId`).
        sourceId:
          type: string
          pattern: "^(ds_|qr_)[0-9a-f]{8}$"
          description: |
            R76 (composition) — the polymorphic DRIVING source: a Dataset
            (`ds_…`, the default — equals `datasetId`) or a saved Query
            (`qr_…`) this query is built ON. Optional this round (additive,
            conformance-safe): when omitted, the source is `datasetId`; when a
            `qr_`, the query is COMPOSED (read via the unified `ds_`/`qr_`
            resolver, J-2′). The design's full rename `datasetId → sourceId`
            is the named cleanup (see composition.md § Data contract).
          examples: ["ds_71a4e2f0", "qr_9c2f10ab"]
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            User-supplied at save time. Unique per workspace (mirrors the
            dataset name-uniqueness rule).
          examples: ["Won deals over $1k (2026)"]
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        resolvedColumns:
          type: array
          description: |
            R71 — the Query's EFFECTIVE columns, server-computed and present
            whenever `definition.joins` is non-empty. It is the ordered
            concatenation across the source dataset ++ every chained dataset
            (`Deals.columns ++ Accounts.columns ++ Owners.columns`), with names
            that collide across sources qualified by dataset (`Deals.id` /
            `Accounts.id`; `accounts.tier` / `owners.tier`). The FE needs this
            to render the joined result's headers (it cannot derive them from
            one source dataset). Omitted for a single-source query (its columns
            are the source dataset's). See multi-join.md § Data contract.
          items:
            type: object
            required: [name, dtype]
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              dtype:
                type: string
                enum: [string, integer, float, boolean, date, datetime]
        createdAt:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: ISO-8601 UTC, `Z`-suffixed. Server-stamped at save time.
          examples: ["2026-06-12T14:02:00Z"]
