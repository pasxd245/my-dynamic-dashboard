# Shared schema: Workspace
# Used by: workspaces/get, workspaces/post, datasets/batch-post (path param)
# Matches the R13 Pydantic model at apps/backend/app/routers/workspaces.py.
components:
  schemas:
    Workspace:
      type: object
      required: [id, name, kind, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
          description: |
            Server-generated. Stable across the lifetime of the workspace.
            Format `ws_<8 lowercase hex chars>`.
          examples: ["ws_3f8a2c91"]
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            User-supplied human label. Unique GLOBALLY — the create/rename
            endpoints enforce it (R25; DB index `idx_workspaces_name_unique`),
            returning 409 `name_taken` on collision. (Unlike datasets / queries
            / dashboards, whose names are unique only per-workspace.)
          examples: ["Marketing"]
        kind:
          type: string
          enum: [main, saved]
          readOnly: true
          description: |
            R193 (item 3.6b) — `main` for every workspace a user creates;
            `saved` for the read-only workspace that holds frozen copies of a
            main workspace's datasets (one per main workspace, created on the
            first save). Every write inside a `saved` workspace answers
            `409 read_only_workspace`, except deleting a copy and deleting the
            empty workspace.
        parentWorkspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
          readOnly: true
          description: |
            R193 — present if and only if `kind` is `saved`: the main workspace
            its copies come from.
        createdAt:
          type: string
          description: |
            ISO-8601 UTC, second-precision, `Z`-suffixed. Server-stamped at
            create time. Sortable as a plain string.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          examples: ["2026-05-24T11:23:45Z"]
