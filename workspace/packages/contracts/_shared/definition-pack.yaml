# Shared schema: Definition pack (R201 — item 4.8)
# Used by: workspaces/definitions-get (response), workspaces/definitions-import
# (request + response), _shared/api-error.yaml (pack_invalid, pack_refused,
# pack_unresolved).
#
# A PACK is a workspace's queries, workflows and dashboards written BY NAME, so
# it can be imported into another workspace of the same install or of another
# install, whose ids differ. It is a transport file — nothing stores it.
# Design: .agents/design/data-management/_shared/definition-pack.md.
#
# What a pack rewrites (everything else is the stored definition as the app's
# own model reads it, `null` members dropped):
#   - a query's `sourceId`                      → `dataset` (the dataset's name)
#   - a query relationship's `leftSourceId` /
#     `rightSourceId`                           → `leftDataset` / `rightDataset`
#   - a query relationship's
#     `originRelationshipId`                    → left out (provenance in the
#                                                 exporting workspace only)
#   - a workflow's `sources[]` (`qr_` / `wf_`)  → `{query: <name>}` /
#                                                 `{workflow: <name>}`
#   - a dashboard widget's `queryId`            → `query` (the query's name;
#                                                 absent on a `note` widget)
# Ids that live INSIDE one definition — a widget's `wdg_`, a control's `ctl_`,
# a query-owned relationship's `qrel_` — travel verbatim. No install id
# (`ds_ qr_ wf_ dsh_ rel_ ws_`) appears in a pack.
#
# A pack is CLOSED: every query or workflow it names is in it. It names the
# datasets its queries read, with their columns in stored order, because query
# filters address columns by 0-based index — an import refuses a dataset whose
# columns differ.
#
# Versioning: `packVersion` is an integer; this install writes and reads 1.
# A pack of another version is refused whole (`pack_invalid`, `version`,
# `supported`) — never read in part. The envelope is closed; the definitions
# inside follow the target app's own models (a field it does not know makes
# that noun `invalid`, by name, rather than being dropped).
components:
  schemas:
    PackColumn:
      type: object
      required: [name, dtype]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        dtype: { $ref: '../_shared/column.yaml#/components/schemas/Dtype' }

    PackDataset:
      type: object
      required: [name, columns]
      additionalProperties: false
      description: |
        A dataset the pack's queries read (a query's `dataset`, a relationship's
        `leftDataset` / `rightDataset`), with its columns in stored order —
        name and dtype only (no hidden flag, coverage or counts). Data never
        travels: the import finds a same-named dataset in the target workspace
        and requires exactly these columns.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        columns:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PackColumn' }

    PackQuery:
      type: object
      required: [name, dataset, definition]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        dataset:
          type: string
          minLength: 1
          maxLength: 120
          description: The name of the dataset the query reads (its `sourceId`, by name).
        definition:
          type: object
          description: |
            The query's definition (`_shared/query.yaml#/QueryDefinition`) with
            each `relationships[]` item's `leftSourceId` / `rightSourceId`
            written as `leftDataset` / `rightDataset` (names) and no
            `originRelationshipId`. Read by the target's own query model after
            the names are resolved; kept free here so the pack does not copy
            the query schema.

    PackWorkflowSource:
      oneOf:
        - type: object
          required: [query]
          additionalProperties: false
          properties:
            query: { type: string, minLength: 1, maxLength: 120 }
        - type: object
          required: [workflow]
          additionalProperties: false
          properties:
            workflow: { type: string, minLength: 1, maxLength: 120 }

    PackWorkflow:
      type: object
      required: [name, definition]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        definition:
          type: object
          required: [sources]
          description: |
            The workflow's definition (`_shared/workflow.yaml#/WorkflowDefinition`)
            with `sources` by name; `steps` as stored.
          properties:
            sources:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/PackWorkflowSource' }

    PackDashboard:
      type: object
      required: [name, slug, definition]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 1
          maxLength: 120
        definition:
          type: object
          description: |
            The dashboard's definition (`_shared/dashboard.yaml#/DashboardDefinition`)
            with each widget's `queryId` written as `query` (a name). Widget
            (`wdg_`) and control (`ctl_`) ids are kept: they live inside this
            definition (a widget note keys `<dashboard>:<widget>`, a viewer link
            names a control of its dashboard).

    DefinitionPack:
      type: object
      required: [packVersion, exportedAt, exportedBy, workspace, datasets, queries, workflows, dashboards]
      additionalProperties: false
      description: |
        Every list is ordered by `name`. Two exports of an unchanged
        workspace differ only in `exportedAt`. A body over 10 MiB, or with more
        than 1 000 queries + workflows + dashboards, is refused on import
        (`pack_invalid`, `too_large`).
      properties:
        packVersion:
          type: integer
          minimum: 1
          description: The pack format's version. This install writes and reads `1`.
        exportedAt:
          type: string
          format: date-time
          description: When the pack was exported (UTC). Informational.
        exportedBy:
          type: string
          description: The exporting app's version. Informational.
        workspace:
          type: string
          description: The exporting workspace's name. Informational — an import never reads it.
        datasets:
          type: array
          items: { $ref: '#/components/schemas/PackDataset' }
        queries:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/PackQuery' }
        workflows:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/PackWorkflow' }
        dashboards:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/PackDashboard' }

    OnConflict:
      type: string
      enum: [refuse, replace, skip]
      description: |
        What to do with a noun whose name exists in the target with a
        different definition: `refuse` (default) — a `conflict`, the apply is
        refused; `replace` — the noun's own update writes the pack's
        definition (its id kept, one history row); `skip` — the target's noun
        is kept and the pack's nouns that name it bind to it.

    PlanKind:
      type: string
      enum: [query, workflow, dashboard]

    PlanAction:
      type: string
      enum: [create, replace, unchanged, skip, conflict, invalid]
      description: |
        `create` — no noun of that name in the target. `unchanged` — the
        target's noun, exported, equals the pack's (nothing is written; under
        every `onConflict`). `replace` / `skip` / `conflict` — by `onConflict`
        (two conflicts no choice resolves block under `refuse` and `replace`:
        `source_differs`, `slug_taken`). `invalid` — the noun cannot be
        imported: a dataset it reads is missing or differs, a noun it reads
        cannot be imported, or its own save check refused it.

    PlanReason:
      type: string
      enum: [exists, source_differs, slug_taken, dataset_missing, columns_differ, needs, check_failed]
      description: |
        Why an item is a `conflict` (`exists`, `source_differs`, `slug_taken`)
        or `invalid` (`dataset_missing`, `columns_differ`, `needs`,
        `check_failed`). `detail` carries the name it is about — the slug, the
        dataset, the noun needed — or, for `check_failed`, the save check's
        own message.

    PlanItem:
      type: object
      required: [kind, name, action]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/PlanKind' }
        name: { type: string, minLength: 1 }
        action: { $ref: '#/components/schemas/PlanAction' }
        id:
          type: string
          pattern: '^(qr|wf|dsh)_[0-9a-f]{8}$'
          description: |
            The target noun's id — the existing one (`replace`, `unchanged`,
            `skip`, `conflict` on `exists` / `source_differs`), or the new one
            after an apply (`create`). Absent on a dry run's `create`, on
            `invalid`, and on a `slug_taken` conflict.
        reason: { $ref: '#/components/schemas/PlanReason' }
        detail: { type: string }

    PlanDataset:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        status:
          type: string
          enum: [found, missing, columns_differ]
          description: |
            `found` — a dataset of that name in the target workspace with the
            pack's columns (name and dtype, in order). `missing` — none of that
            name. `columns_differ` — one of that name with other columns.
        columns:
          type: object
          required: [expected, found]
          additionalProperties: false
          description: Only on `columns_differ` — the pack's columns and the target's.
          properties:
            expected:
              type: array
              items: { $ref: '#/components/schemas/PackColumn' }
            found:
              type: array
              items: { $ref: '#/components/schemas/PackColumn' }

    ImportPlan:
      type: object
      required: [dryRun, applied, onConflict, ok, datasets, items, counts]
      additionalProperties: false
      description: |
        What an import does (a dry run) or did (an apply), per noun, in write
        order: queries; workflows (each after the workflows it reads); then
        dashboards — each kind by name. The dry run and the apply run the
        same code in one transaction; the dry run rolls it back.
      properties:
        dryRun: { type: boolean }
        applied:
          type: boolean
          description: True only on a successful apply — everything was written.
        onConflict: { $ref: '#/components/schemas/OnConflict' }
        ok:
          type: boolean
          description: |
            No dataset `missing` or `columns_differ`, no item `conflict` or
            `invalid` — an apply of this plan writes the whole pack.
        datasets:
          type: array
          items: { $ref: '#/components/schemas/PlanDataset' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlanItem' }
        counts:
          type: object
          required: [create, replace, unchanged, skip, conflict, invalid]
          additionalProperties: false
          properties:
            create: { type: integer, minimum: 0 }
            replace: { type: integer, minimum: 0 }
            unchanged: { type: integer, minimum: 0 }
            skip: { type: integer, minimum: 0 }
            conflict: { type: integer, minimum: 0 }
            invalid: { type: integer, minimum: 0 }

    PackProblem:
      type: object
      additionalProperties: false
      description: |
        One problem in a pack (`pack_invalid`): `kind` + `name` name the noun
        (for a `cycle`, each workflow in the loop); `ref` + `refKind` what it
        names that is not in the pack (`reference`), or the repeated slug
        (`duplicate` of a slug — `ref` set, `refKind` absent).
      properties:
        kind:
          type: string
          enum: [query, workflow, dashboard, dataset]
        name: { type: string }
        ref: { type: string }
        refKind: { $ref: '#/components/schemas/PlanKind' }

    UnresolvedProblem:
      type: object
      required: [kind, name, reason]
      additionalProperties: false
      description: |
        A reference in the exporting workspace that names nothing
        (`pack_unresolved`): `query_missing` — a dashboard widget's query was
        deleted (`ref` = the widget's title); `source_missing` — a workflow
        source was deleted; `dataset_missing` — a query's join dataset was
        deleted.
      properties:
        kind: { $ref: '#/components/schemas/PlanKind' }
        name: { type: string }
        reason:
          type: string
          enum: [query_missing, source_missing, dataset_missing]
        ref: { type: string }
