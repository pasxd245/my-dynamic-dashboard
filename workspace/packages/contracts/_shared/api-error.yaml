# Shared schema: ApiError
# Used by: workspaces/patch, workspaces/delete, datasets/patch, datasets/delete,
#          datasets/columns-patch (R152 — unknown_column, no_visible_columns)
#
# Code-first error envelope introduced by R24 (CRUD hygiene chain). The FE
# branches on `code` without parsing free-text messages. Distinct from the
# FastAPI `{ detail: [...] }` 422 envelope used by existing endpoints
# (uploads, datasets/batch-post, datasets/get) — those keep their shapes; only
# new R23+ endpoints adopt this envelope. A future round may unify if drift
# bites.
#
# Variants, discriminated by `code`:
#   - not_found        — resource id resolves to nothing (404)
#   - name_taken       — rename collides with an existing name (409)
#   - slug_taken       — dashboard slug collides with an existing slug in the
#                        same workspace (409, per-workspace scope) — R101
#   - non_empty        — workspace delete blocked by N datasets (409)
#   - query_stale      — saved query definition no longer validates against
#                        the source dataset's current schema (409) — R69
#
# Each variant uses `additionalProperties: false` to mirror the BE's
# `extra='forbid'` Pydantic discipline (per the R16 conformance pattern).

components:
  schemas:
    ApiErrorCode:
      type: string
      enum: [not_found, name_taken, slug_taken, non_empty, query_stale, relationship_exists, relationship_stale, composition_cycle, coercion_failed, merge_duplicate_keys, unknown_column, no_visible_columns]
      description: |
        Closed enum. Any new error class lands as a new code in a future
        round + contract update — never as a free-text message.

    ApiErrorNotFound:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [not_found]
          description: The requested resource id resolves to nothing.

    ApiErrorNameTaken:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [name_taken]
          description: |
            Rename collision. For workspaces, uniqueness is global; for
            datasets and dashboards, uniqueness is scoped to the parent
            workspace (R101 — a dashboard's NAME collides per-workspace; its
            SLUG collides globally → `slug_taken`).

    ApiErrorSlugTaken:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [slug_taken]
          description: |
            R101 — a dashboard's `slug` collides with another dashboard's slug
            in the SAME workspace. Slug uniqueness is per-workspace, like `name`
            (the route nests the workspace — `/dashboards/<ws_id>/<slug>` — so a
            slug only disambiguates within its project). Returned by
            `POST …/dashboards` and `PUT /dashboards/{id}` (409). Distinct from
            `name_taken` so the FE can point the inline error at the slug field,
            not the name field.

    ApiErrorNonEmpty:
      type: object
      required: [code, datasetCount]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [non_empty]
          description: |
            Workspace deletion is blocked because it still contains
            datasets. The cascade rule (R23) requires the FE to delete or
            move datasets first; no `?cascade=` opt-in in this round.
        datasetCount:
          type: integer
          minimum: 1
          description: |
            How many datasets reference the workspace. The FE renders this
            in the "Workspace not empty" modal copy (e.g., "Marketing has
            4 datasets").
          examples: [4]

    ApiErrorQueryStale:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [query_stale]
          description: |
            A saved query's stored definition no longer validates against
            its source dataset's current schema (a referenced column was
            removed or retyped). Returned by `GET /queries/{id}/rows`
            instead of executing — R69. Distinct from 422 (a malformed
            *request*): the request is well-formed, the stored definition
            drifted. The FE renders the query-mode "needs attention" state
            and points the user at the source dataset to re-save.

    ApiErrorRelationshipExists:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [relationship_exists]
          description: |
            A relationship with the same ordered column-pair already
            exists in this workspace (the unique-pair index, R70). Returned
            by `POST /workspaces/{id}/relationships` (409) instead of
            creating a duplicate governed edge. There is no user-supplied
            name, so this — not `name_taken` — is the collision code.

    ApiErrorRelationshipStale:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [relationship_stale]
          description: |
            A join was requested over a Relationship whose key column was
            removed or retyped after the edge was declared, so the edge no
            longer validates against the current dataset schemas. Returned by
            `GET /queries/{id}/rows` (409) for a joined query instead of
            executing — R71. The first consumer of the code R70 reserved.
            Distinct from `query_stale` (a *predicate* atom drifted): this is
            the *join key* drifting. The FE renders the "join unavailable"
            state and points the user at the workspace Relationships view.

    ApiErrorCompositionCycle:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [composition_cycle]
          description: |
            A Query × Query composition would form a cycle — a query whose
            driving source (`sourceId`) is, directly or transitively, itself.
            Returned by `POST …/queries` and `PUT /queries/{id}` (save-time
            `422`-class guard, surfaced as this code) and by
            `GET /queries/{id}/rows` (409, if a later edit to a base introduced
            the cycle) instead of recursing forever — R76. The composition
            analogue of `cyclic_join` (which guards dataset re-entry in one
            tree); this guards a Query re-entering its own resolution path. The
            FE renders the "composition unavailable — that would loop" state and
            points the user at the base query.

    CoercionFailedCell:
      type: object
      required: [row, value]
      additionalProperties: false
      properties:
        row:
          type: integer
          minimum: 1
          description: |
            1-indexed SOURCE-FILE row — header and skipped/range rows
            INCLUDED, so it is the row number the user sees in Excel or a
            CSV editor and can jump straight to. (R144 correction: the
            original data-row numbering, header excluded, sent users to
            the wrong line when locating the cell to fix.)
          examples: [2103]
        value:
          type: string
          description: The offending cell's value, stringified.
          examples: ['0387353189']

    ApiErrorCoercionFailed:
      type: object
      required: [code, column, dtype, cells, totalFailed]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [coercion_failed]
          description: |
            R143 — a commit-time dtype coercion failed. The batch commit
            applies `column_overrides` by actually casting the data at the
            parquet write — the formatless dtypes (string · integer ·
            float · boolean, R143) and date/datetime via the translated
            `format` (R144; upload.md §Date and datetime coercion); a
            non-NULL cell that cannot cast/parse to the target dtype fails
            the item and aborts the WHOLE batch (atomicity unchanged —
            nothing half-commits). Returned by
            `POST /workspaces/{id}/datasets/batch` (422). Replaces the
            pre-R143 unhandled 500 (`ArrowInvalid`) — the R142-F1 defect.
            `→string` never fails by construction. The FE renders the
            column + sample cells + count inline on the Confirm step.
        sheet:
          type: string
          minLength: 1
          description: Excel only — the failing item's sheet. Omitted on CSV.
        column:
          type: string
          minLength: 1
          description: The column whose coercion failed.
        dtype:
          $ref: '../_shared/column.yaml#/components/schemas/Dtype'
        cells:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/CoercionFailedCell'
          description: The first (up to) 5 offending cells.
        totalFailed:
          type: integer
          minimum: 1
          description: Total count of cells that failed the cast.

    ApiErrorMergeDuplicateKeys:
      type: object
      required: [code, key, duplicateKeyCount, sampleKeys]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [merge_duplicate_keys]
          description: |
            R147 — a merge refresh's INCOMING file carries more than one row
            per declared `merge_key` value, so "incoming row wins" is
            undefined (file row order is not time — the D2 domain decision:
            loud stop, never a silent pick). The batch aborts; the dataset is
            untouched. Evidence the declared key is not the row's identity —
            the fix is a fuller key (add a column) or a cleaned export.
            Returned by `POST /workspaces/{id}/datasets/batch` (422) for
            items carrying `merge_key`.
        key:
          type: array
          minItems: 1
          items:
            type: string
          description: The declared merge_key columns, as sent.
        duplicateKeyCount:
          type: integer
          minimum: 1
          description: How many distinct key values occur on >1 incoming row.
        sampleKeys:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
          description: |
            The first (up to) 5 duplicated key values, stringified; composite
            keys join their parts with " · ".

    ApiErrorUnknownColumn:
      type: object
      required: [code, column]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [unknown_column]
          description: |
            R152 — the `PATCH /datasets/{id}/columns` visibility set named a
            column that is not part of this dataset's schema (422). The whole
            call is rejected; `columns_json` is untouched. Distinct from the
            FastAPI `{ detail }` envelope (a malformed request body) — the
            request is well-formed, but a referenced column name is unknown.
        column:
          type: string
          minLength: 1
          description: The first `hidden` entry that is not a column of this dataset.

    ApiErrorNoVisibleColumns:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [no_visible_columns]
          description: |
            R152 — the `PATCH /datasets/{id}/columns` visibility set would hide
            EVERY column (422; the at-least-one-visible guard — an empty
            row-preview is not a valid state). The call is rejected;
            `columns_json` is untouched.

    ApiError:
      description: |
        Discriminated union over `code`. Use `oneOf` + `discriminator` so
        FE TypeScript can narrow to one variant per branch.
      oneOf:
        - $ref: '#/components/schemas/ApiErrorNotFound'
        - $ref: '#/components/schemas/ApiErrorNameTaken'
        - $ref: '#/components/schemas/ApiErrorSlugTaken'
        - $ref: '#/components/schemas/ApiErrorNonEmpty'
        - $ref: '#/components/schemas/ApiErrorQueryStale'
        - $ref: '#/components/schemas/ApiErrorRelationshipExists'
        - $ref: '#/components/schemas/ApiErrorRelationshipStale'
        - $ref: '#/components/schemas/ApiErrorCompositionCycle'
        - $ref: '#/components/schemas/ApiErrorCoercionFailed'
        - $ref: '#/components/schemas/ApiErrorMergeDuplicateKeys'
        - $ref: '#/components/schemas/ApiErrorUnknownColumn'
        - $ref: '#/components/schemas/ApiErrorNoVisibleColumns'
      discriminator:
        propertyName: code
        mapping:
          not_found: '#/components/schemas/ApiErrorNotFound'
          name_taken: '#/components/schemas/ApiErrorNameTaken'
          slug_taken: '#/components/schemas/ApiErrorSlugTaken'
          non_empty: '#/components/schemas/ApiErrorNonEmpty'
          query_stale: '#/components/schemas/ApiErrorQueryStale'
          relationship_exists: '#/components/schemas/ApiErrorRelationshipExists'
          relationship_stale: '#/components/schemas/ApiErrorRelationshipStale'
          composition_cycle: '#/components/schemas/ApiErrorCompositionCycle'
          coercion_failed: '#/components/schemas/ApiErrorCoercionFailed'
          merge_duplicate_keys: '#/components/schemas/ApiErrorMergeDuplicateKeys'
          unknown_column: '#/components/schemas/ApiErrorUnknownColumn'
          no_visible_columns: '#/components/schemas/ApiErrorNoVisibleColumns'
