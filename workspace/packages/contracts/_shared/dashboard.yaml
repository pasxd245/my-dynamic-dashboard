# Shared schema: Dashboard (R101 — dashboard-as-a-persisted-noun)
# Used by: dashboards/post (response), dashboards/get (response items),
#          dashboards/detail-get (response).
# Matches the FE types in
#   workspace/apps/builder/src/features/dashboard/types.ts
# (validated at F1) and the backend Dashboard SQLModel entity (Backend gate).
#
# A Dashboard is a named, workspace-scoped noun that persists WHICH widgets it
# shows. Each widget is a formula-free chart definition over a saved Query
# (pick query → dimension/measure/agg/chart; never a formula —
# product-value-framing #1). The widgets live in an EMBEDDED-JSON `definition`
# (mirrors `queries.definition`; no separate `dashboard_widgets` table —
# Design decision #1). The persisted dashboard re-runs LIVE against the latest
# upload on open (the way out of the report-maintenance treadmill).
#
# Two uniqueness scopes (ratified at Contract, human, 2026-06-27):
#   - `name` is unique PER WORKSPACE (mirrors the query/dataset name rule).
#   - `slug` is unique PER WORKSPACE (same scope as `name`): the URL nests the
#     workspace (`/dashboards/<ws_id>/<slug>`), so a slug only has to be unique
#     within its project — two projects may each have a `weekly-report`. A
#     collision on each field has its OWN error code (name_taken / slug_taken —
#     _shared/api-error.yaml) so the FE points the inline error at the right
#     field.
components:
  schemas:
    Widget:
      type: object
      description: |
        One chart on a dashboard, defined FORMULA-FREE: a saved Query + which
        column is the dimension (grouping), which is the measure, how to
        aggregate, how to chart it, and how wide it sits in the grid. Bound to
        its Query by id; if that Query is later deleted the widget renders a
        per-widget "query unavailable" state on the detail view (Design
        decision #2) — a dangling `queryId` is tolerated at RENDER, never a
        crash. (At SAVE time the `queryId` must resolve to a query in the
        dashboard's own workspace — see dashboards/post.contract.yaml §422.)
      required: [id, title, chartType, span]
      additionalProperties: false
      # R179 — `queryId` and `agg` are REQUIRED for every chartType except
      # `note`, which binds no query and carries `md` instead (per-field rule,
      # like `measureCol`; the backend enforces it as 422).
      properties:
        id:
          type: string
          pattern: "^wdg_[0-9a-f]{8}$"
          description: Server-generated. Format `wdg_<8 lowercase hex>`.
          examples: ["wdg_4d7b91ce"]
        queryId:
          type: string
          pattern: "^qr_[0-9a-f]{8}$"
          description: |
            FK → Query.id (the saved Query this widget aggregates + charts). At
            save time it must reference a query in the DASHBOARD'S workspace
            (cross-workspace widgets are constrained out — Contract decision,
            human 2026-06-27); a later delete of that query is tolerated and
            renders the per-widget "unavailable" state. R179 — REQUIRED for
            every chartType except `note`, where it must be absent.
          examples: ["qr_9c2f10ab"]
        md:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            R179 — `note` only (absent on every other kind): the widget's text
            in the SAFE MARKDOWN SUBSET — headings, paragraphs, emphasis,
            inline / fenced code, bullet and numbered lists, block quotes,
            horizontal rules, `[text](https://…)` links. The server REJECTS
            (422) raw HTML or anything tag-shaped, images, and links whose
            target is not http(s); nothing is silently stripped. The builder
            renders it with its own parser into React nodes (never injected as
            HTML), so the stored text is exactly what is shown.
          examples: ["## Week 41\n\n- Calls up **12%**\n- See [the sheet](https://example.com)"]
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Widget heading, user-supplied (defaulted from the query name).
        chartType:
          type: string
          enum: [bar, pie, line, stat, combo, scatter, heatmap, gauge, table, note]
          description: |
            The chart kind. `bar` + `pie` + `line` (R109) + `stat` (R110 — a
            single-number KPI) + `combo` (R112) + `scatter` (R113 — raw points)
            + `heatmap` (R114 — 2-D matrix: `dimensionCol` × `seriesCol` → agg,
            the first ECharts-rendered chart) + `gauge` (R115 — a scalar value
            shown against a literal `target`, ECharts) + `table` (R117 — the
            raw query rows as a paged table, no aggregation) + `note` (R179 —
            markdown text, no query: `md` instead of `queryId`). The chart-lib
            ladder (recharts + ECharts) is a PRESENTATION detail behind
            `WidgetView` (lib chosen by chartType; ECharts lazy-loaded), not a
            contract field.
        dimensionCol:
          type: string
          minLength: 1
          description: |
            The grouping column, stored by its logical NAME (not a positional
            index — F1 resolved the name-vs-index question to NAME, so a column
            reorder on the source query doesn't silently re-point the widget).
            Resolved against the query's effective columns at render. OPTIONAL as
            of R110: a `stat` (KPI) widget has no grouping — one aggregate over
            the whole result — so it omits `dimensionCol`. The breakdown charts
            (bar/pie/line) still carry it.
          examples: ["stage", "owner"]
        seriesCol:
          type: string
          minLength: 1
          description: |
            R111 — OPTIONAL second grouping (the "split by" column), by logical
            NAME. When present on a `bar` widget, the roll-up is 2-D
            (dimension × series) and renders grouped bars (one bar per series
            value per dimension group). Absent → single-series, as before. Only
            meaningful for `bar` this round.
          examples: ["region", "channel"]
        measureCol:
          type: string
          minLength: 1
          description: |
            The numeric column summed when `agg === 'sum'`. REQUIRED for `sum`,
            OMITTED for `count` (which tallies rows). Stored by logical NAME,
            like `dimensionCol`. The BE re-validates this presence rule on save
            (a `sum` with no `measureCol`, or a `count` carrying one, is 422) —
            expressed here as a description + per-field rule rather than a
            JSON-Schema if/then, mirroring how query.yaml's FilterAtom handles
            its per-op operand fields.
          examples: ["amount"]
        measureCol2:
          type: string
          minLength: 1
          description: |
            OPTIONAL second numeric column, by logical NAME. R112 `combo`: the
            line measure (summed per dimension, over the bar = `measureCol`).
            R113 `scatter`: the Y axis (raw, with `measureCol` as X — no
            aggregation). Absent for every other chart kind.
          examples: ["count", "margin"]
        target:
          type: number
          minimum: 0
          description: |
            R115 — OPTIONAL gauge target/max: the value the gauge's aggregate is
            shown against. A LITERAL config number (not a data column) — the
            first widget field that isn't a column reference. Absent for every
            other chart kind; absent on a gauge → the gauge maxes at its value.
          examples: [100, 1000000]
        numberFormat:
          type: string
          enum: [plain, compact, percent]
          description: |
            R116 — OPTIONAL per-widget number format (presentation, not data):
            `plain` (1,234) or `compact` (1.2K). Absent → `plain`. The first
            display-only option; the seed of a wider display-options bag.
            R175 — `percent` renders a RATIO (0.0548 → 5.5%): conversion rates
            (CR1/CR2, % QL) are stored as 0..1 floats, the product's ratio
            convention (`pct_of_total`), and only their display is a percent.
          examples: ["compact"]
        agg:
          type: string
          enum: [sum, count]
          description: |
            How the measure is aggregated within each dimension group. `sum`
            totals `measureCol`; `count` tallies rows (no `measureCol`). R179 —
            REQUIRED for every chartType except `note`, where it must be absent.
        span:
          type: integer
          minimum: 1
          maximum: 3
          description: |
            Grid width — how many columns of a 3-column grid the widget
            occupies (1 = a third → 3-up; 2 = two-thirds; 3 = a full row). A
            per-widget size (Tableau-style arranging), a persisted builder
            option (default 1). Reorder/drag-arrange is DEFERRED to the
            dynamic-widgets round (not in this contract).
          examples: [1]
        rows:
          type: integer
          minimum: 1
          maximum: 3
          description: |
            R177 — OPTIONAL grid height: how many widget-rows tall the widget
            is (1 = the standard 300 px body; 2 / 3 = two / three stacked
            widgets tall, gaps included, so a `rows: 2` widget lines up with
            two `rows: 1` widgets stacked beside it). Absent → 1, and the
            server does NOT backfill it: a dashboard saved before this field
            existed re-fetches byte-for-byte as before. A `table` widget shows
            proportionally more rows per page. Presentation only — the
            widget's data and aggregation are untouched by `rows`.
          examples: [2]
        totals:
          type: object
          description: |
            R181 — `table` only: the footer totals, keyed by result column
            name. A column with no entry has no total. `sum` = Σ of the
            column; `ratio` = Σ`num` / Σ`den` — a rate re-derived from its
            parts (the conversion-rate convention), NOT the mean of the rows'
            rates. Computed by the SERVER over the WHOLE result under the
            active filters (`POST /queries/{id}/totals`), so it is right even
            when the visible rows are paged or capped. At most 64 entries.
          maxProperties: 64
          additionalProperties:
            $ref: "#/components/schemas/TotalSpec"
          examples:
            - { calls: { agg: sum }, cr2: { agg: ratio, num: quotes, den: calls } }

    TotalSpec:
      type: object
      required: [agg]
      additionalProperties: false
      properties:
        agg:
          type: string
          enum: [sum, ratio]
        num:
          type: string
          minLength: 1
          description: Ratio only — the numerator column (by result name).
        den:
          type: string
          minLength: 1
          description: Ratio only — the denominator column (by result name).

    DashboardDefinition:
      type: object
      description: |
        The persisted dashboard body — the ordered set of widgets it shows.
        Embedded JSON (mirrors `queries.definition`); no separate widgets
        table. Empty `widgets` is valid (a freshly-created dashboard before its
        first widget — the detail view's "add your first widget" empty state).
      required: [widgets]
      additionalProperties: false
      properties:
        widgets:
          type: array
          description: |
            The dashboard's widgets, in display order. Each is a formula-free
            chart over a saved Query. Reorder is deferred, but the order here is
            the render order.
          items:
            $ref: "#/components/schemas/Widget"

    Dashboard:
      type: object
      required: [id, workspaceId, name, slug, definition, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^dsh_[0-9a-f]{8}$"
          description: Server-generated. Format `dsh_<8 lowercase hex>`.
          examples: ["dsh_71a4e2f0"]
        workspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
          description: |
            FK to the OWNING workspace (the IA scope: the workspace-scoped list
            + per-workspace name-uniqueness). Every widget's query must live in
            this same workspace (cross-workspace widgets constrained out).
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            User-supplied display name. Unique PER WORKSPACE (mirrors the
            query/dataset name rule). A collision is `409 name_taken`.
          examples: ["Weekly report"]
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 1
          maxLength: 120
          description: |
            URL slug — the route is `/dashboards/<ws_id>/<slug>` (workspace =
            project; the project is nested in the path). Dash-case, lowercase
            alphanumerics + single internal hyphens; auto-derived from `name`
            (diacritics stripped for vi) but USER-EDITABLE. Unique PER WORKSPACE
            (same scope as `name` — Contract decision, human 2026-06-27): the
            workspace is in the path, so the slug only disambiguates within its
            project (two projects may each have `weekly-report`). A collision is
            `409 slug_taken`. The FE resolves slug → dashboard from the
            workspace's dashboard list (no global slug lookup).
          examples: ["weekly-report"]
        definition:
          $ref: "#/components/schemas/DashboardDefinition"
        createdAt:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: ISO-8601 UTC, `Z`-suffixed. Server-stamped at create time.
          examples: ["2026-06-27T14:02:00Z"]
