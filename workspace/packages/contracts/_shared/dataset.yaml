# Shared schema: Dataset
# Used by: datasets/batch-post (response), datasets/get (response items)
# Matches the data model in .agents/design/data-management/datasets/datasets.md.
components:
  schemas:
    SourceFormat:
      type: string
      enum: [excel, csv, workflow]
      description: |
        Wizard path that produced this dataset — or `workflow` (R192): the
        dataset is a workflow's output published by `POST /workflows/{id}/publish`
        (it carries `lineage`, and is refreshed by re-publishing, never by
        upload). Closed enum; future sources (api, sql, website) require a
        contract change.

    Dataset:
      type: object
      required:
        [
          id,
          workspaceId,
          name,
          sizeBytes,
          rowCount,
          columnCount,
          columns,
          sourceFormat,
          createdAt,
          refreshedAt,
          dataVersion,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^ds_[0-9a-f]{8}$'
          description: Server-generated. Format `ds_<8 lowercase hex>`.
          examples: ['ds_71a4e2f0']
        workspaceId:
          type: string
          pattern: '^ws_[0-9a-f]{8}$'
          description: Foreign key to the containing workspace.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            User-supplied in the wizard's Confirm step. Defaults to the
            filename stem; for Excel multi-sheet uploads, `<stem>_<sheet>`.
          examples: ['q1_pipeline_Deals']
        sizeBytes:
          type: integer
          minimum: 0
          description: Size of the originally uploaded file in bytes.
        rowCount:
          type: integer
          minimum: 0
          description: Non-null at commit; the parser populated this.
        columnCount:
          type: integer
          minimum: 1
          description: Always ≥ 1 (a dataset with no columns cannot commit).
        columns:
          type: array
          minItems: 1
          items:
            $ref: '../_shared/column.yaml#/components/schemas/Column'
        sourceFormat:
          $ref: '#/components/schemas/SourceFormat'
        sheetName:
          type: string
          description: |
            Present iff `sourceFormat === 'excel'`. The original sheet name
            from the uploaded workbook.
          examples: ['Deals', 'Contacts']
        createdAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          description: ISO-8601 UTC, `Z`-suffixed. Set at commit time.
        refreshedAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          readOnly: true
          description: |
            R185 (W-4) — when the dataset's rows last changed: the commit time
            for a new dataset, then the time of each successful refresh
            (replace, merge or append). Stamped by the server in the same write
            that swaps the rows in; no request body can set it. A rename or a
            column-visibility change does not touch it.
        dataVersion:
          type: integer
          minimum: 1
          readOnly: true
          description: |
            R185 (W-4) — a counter for the dataset's rows: 1 at commit, +1 on
            every successful refresh, never reused, never set by a client. Two
            reads with the same `dataVersion` saw the same rows; a run or a note
            that records it can later tell whether the data moved since.
          examples: [1, 4]
        lineage:
          $ref: '#/components/schemas/DatasetLineage'

    DatasetLineage:
      type: object
      readOnly: true
      required: [workflowId, workflowName, runId, runNumber, runAt, definitionHash, sources, publishedAt]
      additionalProperties: false
      description: |
        R192 — where a published dataset (`sourceFormat: workflow`) came from:
        written by the server only, copied from the workflow's run stamp
        (R187) at publish time; absent on every uploaded dataset. It keeps
        naming the run after the workflow is deleted or runs again.
      properties:
        workflowId:
          type: string
          pattern: '^wf_[0-9a-f]{8}$'
        workflowName:
          type: string
          minLength: 1
          description: The workflow's name at publish time.
        runId:
          type: string
          pattern: '^run_[0-9a-f]{8}$'
        runNumber:
          type: integer
          minimum: 1
        runAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          description: When that run materialized (the workflow's `materializedAt` then — its next run overwrites it there).
        definitionHash:
          type: string
          description: The workflow definition's version at that run.
        sources:
          type: array
          items:
            $ref: '../_shared/workflow.yaml#/components/schemas/WorkflowRunSource'
          description: What that run read, per source.
        publishedAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
