# Shared schema: ColumnOverride
# Used by: datasets/batch-post (request — per-item `column_overrides` map)
# Carried per-column from the wizard's Metadata step to the commit endpoint.
# Format string is required only for date / datetime dtype overrides.
# R143: formatless dtypes (string/integer/float/boolean) are APPLIED at the
# parquet write. R144: date/datetime join the coerced set — the `format` is
# translated (Java tokens → strptime) and applied for real at the write
# (upload.md §Date and datetime coercion).
components:
  schemas:
    ColumnOverride:
      type: object
      required: [dtype]
      additionalProperties: false
      properties:
        dtype:
          $ref: "../_shared/column.yaml#/components/schemas/Dtype"
        format:
          type: string
          description: |
            Date / datetime format string in Java `DateTimeFormatter` syntax.
            Required iff dtype is `date` or `datetime`; ignored for other
            dtypes. Default = the wizard's auto-detected format from sample
            rows. R144 — supported token subset: `yyyy MM dd HH mm ss` plus
            non-alphabetic literal separators (translated to `%`-style
            strptime at the parquet write); any other alphabetic run → 422
            `format_unsupported` at commit validation. A `date` dtype's
            format must carry date tokens only (no HH/mm/ss). Cell padding
            is lenient (`3-7-2026` parses under `dd-MM-yyyy`); unparseable
            cells → 422 `coercion_failed` (the R143 envelope).
          examples: ["yyyy-MM-dd", "yyyy-MM-dd HH:mm:ss", "MM/dd/yyyy"]
