# Shared schema: Column
# Used by: uploads/parse, datasets/batch-post, datasets/get, _shared/dataset,
#          datasets/columns-patch (R152 hidden view-hint)
# A single column in a parsed dataset's schema.
components:
  schemas:
    Dtype:
      type: string
      enum: [string, integer, float, boolean, date, datetime]
      description: |
        Dataset column data type. Set of values is closed for R15+;
        adding a new dtype is a contract change.

    Column:
      type: object
      required: [name, dtype]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Column header. For files with a header row this is the original
            cell value (trimmed). For files parsed with `has_header: false`
            this is auto-generated as `column1, column2, …`.
          examples: ["deal_id", "amount", "closed_at"]
        dtype:
          $ref: "#/components/schemas/Dtype"
        hidden:
          type: boolean
          description: |
            R152 presentation-only view-hint. Absent or `false` = visible.
            When `true`, the dataset-detail row-preview (`PagedRowsView`)
            default-hides this column (with a "show all columns" escape);
            EVERY picker (filter · advanced-query · relationship-key ·
            query-builder · join · workflows) IGNORES it — a hidden column
            stays fully joinable/selectable/filterable. NEVER touches the
            parquet: it lives only in `columns_json`, set via
            `PATCH /datasets/{id}/columns`. A refresh carries it forward by
            name (a column no longer present drops its hint).
        coverage:
          $ref: "#/components/schemas/ColumnCoverage"

    ColumnCoverage:
      type: object
      required: [blankShare]
      additionalProperties: false
      description: |
        R178 — what period a `date` / `datetime` column covers, profiled by
        the SERVER over the committed parquet at commit and again at every
        refresh (replace / merge / append). Present only on committed temporal
        columns of a Dataset (never on an upload-parse preview, never on other
        dtypes); absent on datasets committed before R178 until their next
        refresh. Read-only: the user cannot set it. `min` / `max` are the
        earliest and latest non-blank value as ISO-8601 strings (`YYYY-MM-DD`
        for `date`, `YYYY-MM-DDTHH:MM:SS` for `datetime`); both are absent when
        every row is blank. `blankShare` is the share of blank rows, 0..1.
      properties:
        min:
          type: string
          examples: ["2026-03-01", "2026-02-28T14:02:00"]
        max:
          type: string
          examples: ["2026-05-14", "2026-05-08T15:22:00"]
        blankShare:
          type: number
          minimum: 0
          maximum: 1
          examples: [0.25]
