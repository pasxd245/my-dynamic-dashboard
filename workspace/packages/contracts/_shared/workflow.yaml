# Shared schema: Workflow (R132 — the `queries ⇒ workflows` module)
# Used by: workflows/post (response), workflows/get (items), workflows/detail-get.
#
# A Workflow is a workspace-scoped noun that consolidates + transforms saved
# QUERIES into a MATERIALIZED output. It REUSES the query transform `steps` union
# (query.yaml). Persistence mirrors the Query noun (raw-SQLite + a definition blob).
components:
  schemas:
    WorkflowDefinition:
      type: object
      description: |
        R135 — a workflow's sources (saved queries `qr_` and/or workflow outputs
        `wf_`) + transform steps. ≥1 source, CONSOLIDATED via UNION ALL BY NAME. The
        `steps` reuse the query transform union
        (aggregate/derive/filter/top_n/sort/select/date_bucket).
      required: [sources]
      additionalProperties: false
      properties:
        sources:
          type: array
          minItems: 1
          description: |
            The source ids this workflow consolidates: saved queries (`qr_…`) and/or
            another workflow's materialized output (`wf_…`, output-as-source, R135).
            R186 — each id at most once; every source must resolve when saved (a
            `wf_` source must have been run) and have the FIRST source's shape: the
            same column names (any order) with equal dtypes, except that integer and
            float widen to float. With 2+ sources the output gains a final string
            column `Source.Query` (suffixed `Source.Query1`, … off a collision) whose
            value is the name of the source each row came from.
          items:
            type: string
            pattern: "^(qr_|wf_)[0-9a-f]{8}$"
        steps:
          type: array
          description: |
            Ordered transforms (reuses `query.yaml` step kinds). Empty = passthrough.
            R194 — the shared `filter` / `case` operands accept a `ParamRef` in the
            schema, but a workflow declares no parameters (D6): a step operand that
            references one is refused at save (422).
            R163 — this list stays a MIRROR of `QueryDefinition.steps`: the Python
            side shares ONE `Step` union across both nouns and both fold the same
            `_apply_step`, so a kind added to the query union must be added here
            too or the contract would forbid what the engine accepts.
          items:
            oneOf:
              - $ref: "query.yaml#/components/schemas/AggregateStep"
              - $ref: "query.yaml#/components/schemas/TopNStep"
              - $ref: "query.yaml#/components/schemas/DeriveStep"
              - $ref: "query.yaml#/components/schemas/FilterStep"
              - $ref: "query.yaml#/components/schemas/SortStep"
              - $ref: "query.yaml#/components/schemas/SelectStep"
              - $ref: "query.yaml#/components/schemas/DateBucketStep"
              - $ref: "query.yaml#/components/schemas/GroupColumnStep"
              - $ref: "query.yaml#/components/schemas/WindowColumnStep"
              - $ref: "query.yaml#/components/schemas/DatePartStep"
              - $ref: "query.yaml#/components/schemas/CaseStep"
              - $ref: "query.yaml#/components/schemas/DateDiffStep"
              - $ref: "query.yaml#/components/schemas/ComputeStep"
              - $ref: "query.yaml#/components/schemas/ConversionWindowStep"
            discriminator:
              propertyName: kind
              mapping:
                aggregate: "query.yaml#/components/schemas/AggregateStep"
                top_n: "query.yaml#/components/schemas/TopNStep"
                derive: "query.yaml#/components/schemas/DeriveStep"
                filter: "query.yaml#/components/schemas/FilterStep"
                sort: "query.yaml#/components/schemas/SortStep"
                select: "query.yaml#/components/schemas/SelectStep"
                date_bucket: "query.yaml#/components/schemas/DateBucketStep"
                group_column: "query.yaml#/components/schemas/GroupColumnStep"
                window_column: "query.yaml#/components/schemas/WindowColumnStep"
                date_part: "query.yaml#/components/schemas/DatePartStep"
                case: "query.yaml#/components/schemas/CaseStep"
                date_diff: "query.yaml#/components/schemas/DateDiffStep"
                compute: "query.yaml#/components/schemas/ComputeStep"
                conversion_window: "query.yaml#/components/schemas/ConversionWindowStep"

    WorkflowRun:
      type: object
      required: [id, number, definitionHash, sources]
      additionalProperties: false
      readOnly: true
      description: |
        R187 (W-7) — the server's stamp of the last run, written only by
        `POST /workflows/{id}/run`; absent before a stamped run and after a
        definition change (which clears the output). Workflows last run before
        R187 carry none until their next run.
      properties:
        id:
          type: string
          pattern: "^run_[0-9a-f]{8}$"
          description: New on every run.
        number:
          type: integer
          minimum: 1
          description: Per-workflow run counter — 1, 2, 3 … never reset.
        definitionHash:
          type: string
          description: |
            The workflow definition's version at run time — the same value a
            metadata entry on this workflow records as `definitionVersion`.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRunSource"
    WorkflowRunSource:
      type: object
      required: [id]
      additionalProperties: false
      description: |
        One source as a run read it (R187). Shared by `WorkflowRun.sources` and
        a published dataset's `lineage.sources` (R192).
      properties:
        id:
          type: string
          pattern: "^(qr_|wf_)[0-9a-f]{8}$"
        definitionHash:
          type: string
          description: A query source — its definition's version at run time.
        dataVersions:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: A query source — `dataVersion` of each dataset it reads, by dataset id.
        runId:
          type: string
          pattern: "^run_[0-9a-f]{8}$"
          description: A workflow source — the run of it this run read.
        params:
          type: object
          description: |
            R194 (dashboard-filters.md D6) — a query source that declares
            parameters: the value each was run with (a run uses defaults only;
            relative dates resolved at run time). Omitted when it declares none.
            A re-run on another day with a `today` default is a new run with a
            new value, not a stale one — and a `today` default moving after the
            run does not make the run stale for publish (staleness is the
            definition hash and data versions only). Only parameters the source
            uses are recorded.
          additionalProperties:
            type: [string, number]
    WorkflowStaleSource:
      description: One source that moved since the last run (R187); shared with a `not_publishable` refusal (R192).
      type: object
      required: [sourceId, reason]
      additionalProperties: false
      properties:
        sourceId:
          type: string
          pattern: "^(qr_|wf_)[0-9a-f]{8}$"
        name:
          type: string
          description: The source's current name (omitted when it no longer exists).
        reason:
          type: string
          enum: [source_missing, definition_changed, data_refreshed, source_rerun]
          description: |
            `source_missing` — the source, or a dataset it reads, is gone, or a
            workflow source has no output any more. `definition_changed` — the
            source query was edited. `data_refreshed` — a dataset it reads was
            refreshed (its `dataVersion` moved). `source_rerun` — a workflow
            source was run again.
    Workflow:
      type: object
      required: [id, workspaceId, name, definition, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^wf_[0-9a-f]{8}$"
          description: Server-generated. Format `wf_<8 lowercase hex>`.
          examples: ["wf_9c2f10ab"]
        workspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{8}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: User-supplied; unique per workspace.
        definition:
          $ref: "#/components/schemas/WorkflowDefinition"
        resolvedColumns:
          type: array
          description: |
            R133 — the MATERIALIZED output's captured columns; present only once the
            workflow has been run. Omitted before the first run.
          items:
            type: object
            required: [name, dtype]
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1 }
              dtype:
                type: string
                enum: [string, integer, float, boolean, date, datetime]
        materializedAt:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: R133 — ISO-8601 UTC of the last materialize (run). Omitted before first run.
        run:
          $ref: "#/components/schemas/WorkflowRun"
        staleSources:
          type: array
          minItems: 1
          readOnly: true
          description: |
            R187 (W-7) — the sources that moved since the last run, computed on every
            read by comparing `run.sources` with the database now (metadata only, no
            data scanned). Omitted when none moved, and when there is no stamp to
            judge (never run, or last run before R187). A flag, never a block: the
            output stays readable; re-running clears it.
          items:
            $ref: "#/components/schemas/WorkflowStaleSource"
        published:
          type: object
          readOnly: true
          required: [datasetId, datasetName, dataVersion, runId, runNumber]
          additionalProperties: false
          description: |
            R192 — the dataset this workflow published in its workspace (one per
            workflow), computed on read; omitted when there is none. `runId` /
            `runNumber` are the run it was published from — when `runId` differs
            from `run.id`, the workflow has run since.
          properties:
            datasetId: { type: string, pattern: "^ds_[0-9a-f]{8}$" }
            datasetName: { type: string, minLength: 1 }
            dataVersion: { type: integer, minimum: 1 }
            runId: { type: string, pattern: "^run_[0-9a-f]{8}$" }
            runNumber: { type: integer, minimum: 1 }
        createdAt:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
