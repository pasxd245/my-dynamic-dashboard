# Central values for js-tmpl-rendered config files across the workspace.
#
# Layout (R27): this file lives at workspace/config/values.yaml alongside
# the js-tmpl render config and the per-app template subdirs — single
# directory home for everything config-related. Generated outputs
# (apps/builder/.env, apps/backend/data/config/*.yaml,
# apps/*/src|app/_generated/constants.{ts,py}) are gitignored.
#
# Edit a value here, run `pnpm config:render`, and the generated files
# refresh. Pre-commit hook re-renders + verifies no drift.
#
# Per the readiness chain: R27 ships FE .env + one cross-language
# constants module (ID patterns) end-to-end. R28+ extends to BE config
# + full constants audit + i18n.

# ---------------------------------------------------------------------------
# Backend service config (R28 consumes; R27 just seeds the shape so R28's
# work stays mechanical). Mirrors drifted's default.yaml structure exactly.
# ---------------------------------------------------------------------------
backend:
  host: '0.0.0.0'
  port: 8000
  workers: 1
  log_level: 'INFO'
  cors_allow_origins:
    - 'http://localhost:3000'
    - 'http://127.0.0.1:3000'
  upload_max_bytes: 104857600 # 100 MiB

  # R30: runtime data root (hosts uploads_tmp/, datasets/, app.sqlite).
  # null → falls back to <BACKEND_ROOT>/data via app/_config/paths.py.
  # Override via MDD_BACKEND__DATA_DIR=/var/lib/mdd for production deploys.
  data_dir: null

  # R30: tmp-upload sweep job — runtime safety net. Lifespan-spawned
  # asyncio task that hard-deletes uploads_tmp/<temp_id>/ dirs older
  # than the TTL. Disabled in tests via MDD_BACKEND__TMP_SWEEP__ENABLED=false.
  tmp_sweep:
    enabled: true
    interval_seconds: 3600 # 1 hour
    ttl_seconds: 86400 # 24 hours — matches the contract's documented TTL

# ---------------------------------------------------------------------------
# Builder (FE) config — feeds VITE_* env vars via .env.hbs template.
# ---------------------------------------------------------------------------
builder:
  api_base_url: 'http://localhost:8000'
  log_level: 'info'

  # R45: opt-in MSW mock layer. When true, the dev server (`pnpm dev`)
  # routes contract endpoints through workspace/apps/builder/src/mocks/
  # instead of hitting the real BE. Always-false default — devs flip
  # locally when they want offline work; committing `true` would
  # surprise teammates. Renders as `VITE_MOCKS=1` in .env when on,
  # absent when off (main.tsx checks `=== '1'`).
  enable_mock: false

# ---------------------------------------------------------------------------
# i18n placeholder — R32 will consume; R27 includes for free so R32 doesn't
# need a retrofit. Drifted shipped this exact shape.
# ---------------------------------------------------------------------------
i18n:
  locale: 'en-US'

# ---------------------------------------------------------------------------
# Cross-language constants — values shared by BE Pydantic, FE TS, and
# (sometimes) OpenAPI YAMLs. R27 ships id_patterns end-to-end as the
# PoC; R29 fills out error_codes / name_length / format_enums / etc.
# ---------------------------------------------------------------------------
constants:
  id_patterns:
    workspace: '^ws_[0-9a-f]{8}$'
    dataset: '^ds_[0-9a-f]{8}$'
    temp: '^tmp_[0-9a-f]{16}$'
    query: '^qr_[0-9a-f]{8}$' # R69 — Saved Query
    relationship: '^rel_[0-9a-f]{8}$' # R70 — relationship governance (edge)
    query_relationship: '^qrel_[0-9a-f]{8}$' # R88 — query-owned relationship (copy-on-pick / free-form)
    dashboard: '^dsh_[0-9a-f]{8}$' # R101 — persisted dashboard (noun)
    widget: '^wdg_[0-9a-f]{8}$' # R101 — dashboard widget

  # R29: code-first error envelope keys (matches contracts/_shared/api-error.yaml).
  # The Pydantic Literal annotations on BE side and the discriminated TS union
  # on FE side stay hand-authored — these constants centralize the runtime
  # branch + default-value sites.
  error_codes:
    not_found: 'not_found'
    name_taken: 'name_taken'
    non_empty: 'non_empty'
    query_stale: 'query_stale' # R69 — saved query def no longer validates vs current schema
    relationship_exists: 'relationship_exists' # R70 — duplicate governed edge (same workspace + column pair)
    relationship_stale: 'relationship_stale' # R71 — join over an edge whose key column drifted (blocks the join)
    composition_cycle: 'composition_cycle' # R76 — Query × Query composition would loop (a query transitively builds on itself)
    slug_taken: 'slug_taken' # R101 — dashboard slug collides within its workspace (per-workspace, like name)

  # R29: name-length bounds enforced by Pydantic on BE + AntD Form rules on
  # FE. Workspace names globally unique, max 80; dataset names per-workspace
  # unique, max 120 (wider because Excel sheet-suffix names).
  name_lengths:
    workspace_max: 80
    dataset_max: 120
    query_max: 120 # R69 — query name, per-workspace unique (mirrors dataset)
    dashboard_max: 120 # R101 — dashboard name + slug, both unique per-workspace

  # R72: page-size vocabulary — the items-per-page options every paged-rows
  # view offers (dataset rows, saved-query run, builder preview) and the
  # page_size enum those endpoints enforce. Single source: BE validation +
  # FE clamps/options read PAGE_SIZES; the OpenAPI enums $ref the shared
  # _shared/pagination.yaml#/PageSize, which mirrors this list.
  page_sizes: [10, 25, 50, 100]
  default_page_size: 50 # the app-wide clamp default (datasets + saved-query run)

  # R104: dashboard widget fetch cap — the max rows a widget pulls before it
  # stops + warns the view is partial. Bounds the client-side fetch for an
  # oversized query; the cap is #1's boundary (beyond it = a compute-pull /
  # heavier-tier signal). R107: now ALSO a BE consumer — GET
  # /queries/{id}/rows?unpaged=true caps its single-request response server-side at
  # this value (the unpaged path can't bypass the bound).
  dashboard_max_rows: 10000
