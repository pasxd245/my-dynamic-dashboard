[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "my-dynamic-dashboard-backend"
dynamic = ["version"]
description = "Backend service for my-dynamic-dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.38",
    "alembic==1.14.1",
    "polars==1.30.0",
    "openpyxl==3.1.5",
    "fastexcel==0.11.5",
    "python-multipart==0.0.20",
    "pytest==8.3.5",
    "httpx==0.28.1",
    "duckdb==1.1.3",
    "PyYAML>=6.0",
    "RecursiveNamespaceV2>=0.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.1",
    "build>=1.3.0",
    "hatch>=1.14.2",
    "commitizen>=4.10.0",
]
test = [
    "pytest>=8.3.5",
    "coverage>=7.2.7",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "apps/backend/v(?P<version>.*)"
raw-options.root = "../.."
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: unit-layer tests",
    "integration: integration-layer tests",
    "contract: contract-layer tests",
    "perf: opt-in performance harness tests",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
ignore_errors = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "apps/backend/v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
