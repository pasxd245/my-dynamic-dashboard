services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  builder:
    build:
      context: ..
      dockerfile: apps/builder/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    environment:
      DASHBOARD_API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

  builder-smoke:
    image: curlimages/curl:8.8.0
    profiles:
      - smoke
    depends_on:
      - backend
    command:
      - "-fsS"
      - "-X"
      - "POST"
      - "http://backend:8000/api/v1/ops/smoke/builder-workflow"
