description = "Drive the active PDCA round to its next human-decision gate via the pdca-next skill."
prompt = """
# /pdca

Drive the active PDCA round forward.

## User Input

```text
{{args}}
```

Consider the user input before proceeding. If the user passes `Round_NN only`,
treat that as an explicit target. If the user passes `dry-run`, report the plan
of action without editing files.

## Behavior

1. Invoke the `pdca-next` skill in executor mode. See
   `.agents/skills/pdca-next/SKILL.md`.
2. The skill will:
   - Deterministically select the lowest-numbered open round, or stop at a
     selection gate if multiple rounds are open.
   - Treat decorated `Complete` statuses as complete via a leading whole-status match
     (`^\\s*(complete|completed)\\b`); treat `Deferred`, `Superseded`, and
     `Rejected` as inactive unless explicitly targeted by the user.
   - Advance Plan -> Do -> Check -> Act, looping Do <-> Check until all spec
     tasks are checked and verification passes.
   - Stop at human gates only: ambiguous selection, missing spec slug,
     persistent task failure, critical analyze finding, or round completion.

## Output

Return a single block:

```text
PDCA cycle: Round_XX (<phase>)
Last action: <what just ran>
Status: ran-to-gate | gate-hit | round-complete
Gate (if any): <what's needed from user>
Next on resume: <what /pdca will do next time>
Compaction: not due | due | blocked
```

## Notes

- If an explicitly targeted round is Deferred, Superseded, or Rejected, stop
  and ask whether to reopen/resume, supersede, or create the next round before
  editing implementation files.
- Keep the response tight. The diff in the round file and `tasks.md` is the
  real artifact.
"""
