; @self/orchestrator default config.
; Override path: --config <path> | $SELFEVO_CONFIG | cwd/config/self-evo.ini
; → package default (this file).

[run]
workspaceDir = .agents/temp/workspace/runs
checkpointer = sqlite

[llm]
; YAML file with per-node routing. Relative to cwd.
; configPath = .agents/orchestrators/self-evo/config/llm.yaml

[skills]
dir = .agents/skills

[mem0]
; mode: memory | file | cloud | disabled
;   memory   - in-RAM, resets each process (dev default)
;   file     - JSONL at the path below; persists across runs
;   cloud    - reserved for a later round; install mem0ai
;   disabled - intake leaves priorMemories empty
mode = memory
; file = .agents/orchestrators/self-evo/memories.jsonl
; apiKey =                                  ; required by cloud mode

; --- Verifier ----------------------------------------------------------
; Channels available out of the box: lint, typecheck, tests, smoke
; (defined in src/tools/shell.ts). Per-changeType overrides take
; precedence; otherwise verify.default.channels applies.

[verify.default]
channels = lint
; timeoutMs = 300000

[verify.bug-fix]
channels = lint, typecheck, tests

[verify.feature]
channels = lint, typecheck, tests, smoke

[verify.refactor]
channels = lint, typecheck, tests

[verify.doc]
channels = lint

[verify.spike]
channels = lint

; --- Reflection loop ----------------------------------------------------
; The judge scores state on a 0..1 scale; when the score falls below
; `approveThreshold`, the graph re-enters at `verdict.revertTo` for up
; to `maxIterations` passes. After the cap the judge force-approves so
; HITL always gets a turn.

[reflection]
enabled = true
maxIterations = 3
approveThreshold = 0.8
maxChars = 12000
