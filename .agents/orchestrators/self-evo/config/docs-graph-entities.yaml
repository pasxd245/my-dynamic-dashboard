# Curated entity dictionary used by docs-graph's structural drift detector.
#
# Entries:
#   id          canonical id (kebab-case, no spaces)
#   display     human-readable label shown in the UI / tool output
#   kind        tool | spec | symbol | file | concept
#   aliases     surface strings that should match (word-boundary, case-sensitive
#               unless `caseInsensitive: true`); the canonical display is auto-added
#   codeHints   substrings to grep for inside apps/, packages/, devops/,
#               .agents/orchestrators/ to count as a "code usage"; if empty the
#               entity is documentation-only (no code-drift check)
#
# The dict is repo-specific. Add entries when you see a concept claimed in docs
# that's worth verifying against code.

entities:
  - id: duckdb
    display: DuckDB
    kind: tool
    aliases: ["DuckDB", "duckdb"]
    codeHints: ["import duckdb", "duckdb.connect"]
  - id: polars
    display: Polars
    kind: tool
    aliases: ["Polars", "polars"]
    codeHints: ["import polars", "pl.DataFrame", "pl.read_csv", "pl.read_excel"]
