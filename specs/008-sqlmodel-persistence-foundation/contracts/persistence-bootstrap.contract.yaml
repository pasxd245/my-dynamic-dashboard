contract: persistence-bootstrap
version: 1.0.0
feature: 008-sqlmodel-persistence-foundation
status: draft
owner: backend-maintainers

context:
  objective: >-
    Govern metadata schema lifecycle through Alembic migrations backed by
    SQLModel metadata while preserving current service behavior.
  locked_decisions:
    - baseline_strategy: per-model-op-create-table
    - existing_db_strategy: auto-stamp-before-upgrade
    - service_layer_scope: sqlite3-raw-hold

interfaces:
  environment:
    METADATA_DB_PATH:
      required: false
      type: string
      default: apps/backend/data/metadata.db
      description: Absolute or relative path to metadata sqlite database file.

  startup_bootstrap:
    input:
      db_path:
        source: METADATA_DB_PATH
      db_exists:
        type: boolean
      has_alembic_version_table:
        type: boolean
    sequence:
      - step: detect_state
        description: Determine DB existence and migration tracking state.
      - step: stamp_head
        when: db_exists == true && has_alembic_version_table == false
        command: alembic stamp head
      - step: upgrade_head
        command: alembic upgrade head
    expected_outcomes:
      fresh_db:
        description: Creates schema at migration head.
      existing_untracked_db:
        description: Becomes migration-tracked and converges to head in one boot.
      existing_tracked_db:
        description: Upgrade remains idempotent at head.

  migration_revisions:
    baseline:
      revision_label: 0001_baseline
      rule: Must use explicit op.create_table calls for parity tables.
      tables_expected_count: 26
    additive:
      revision_label: 0002_column_mappings
      rule: Must only add column_mappings and its constraints/indexes.

invariants:
  - name: legacy_schema_parity
    requirement: >-
      Legacy metadata tables and columns remain equivalent to metadata_db.py
      definitions, including saved_queries additive columns formerly patched at runtime.
    allowed_additions:
      - alembic_version
      - column_mappings

  - name: column_mappings_shape
    requirement: >-
      column_mappings exposes id, workspace_id, source_file_id, from_column_name,
      to_column_name, from_version, to_version, confidence, accepted_by, created_at.
    checks:
      confidence_range: 0.0..1.0
      workspace_fk_required: true
      source_file_fk_nullable: true

  - name: service_layer_hold
    requirement: Existing backend services continue using sqlite3 raw access in this feature.

verification:
  required_checks:
    - unchanged_backend_tests_pass
    - legacy_vs_migrated_schema_diff_clean_except_allowed_additions
    - upgrade_downgrade_upgrade_idempotent
    - startup_auto_stamp_path_successful
  evidence_artifacts:
    - pytest_output
    - sqlite_schema_diff_output
    - alembic_history_and_current_output
    - startup_boot_logs

out_of_scope:
  - service rewrite to SQLModel sessions
  - pydantic schema consolidation
  - fuzzy rename matcher runtime logic
  - schema reshaping beyond parity plus column_mappings
