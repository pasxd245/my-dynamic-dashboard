openapi: 3.1.0
info:
  title: Upload Profile Field Roles API
  version: 0.1.0
  description: >-
    MVP 1 contract for workspace upload, profiling, role assignment,
    readiness evaluation, and manifest reproducibility.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/workspaces:
    post:
      summary: Create workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces/{workspaceId}/sources/upload:
    post:
      summary: Upload CSV/XLSX source into workspace
      operationId: uploadSource
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Source parsed and committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceUploadResponse'
        '400':
          description: Unsupported, encrypted, or malformed file
  /api/v1/workspaces/{workspaceId}/sheets/{sheetId}/override:
    patch:
      summary: Override sheet header row and/or data range
      operationId: overrideSheetRange
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SheetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                headerRow:
                  type: integer
                  minimum: 1
                dataRange:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Sheet override applied and profile recomputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sheet'
  /api/v1/workspaces/{workspaceId}/profile:
    get:
      summary: Get workspace profile summary
      operationId: getWorkspaceProfile
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Profile snapshot
          content:
            application/json:
              schema:
                type: object
                required: [columns]
                properties:
                  columns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ColumnProfile'
  /api/v1/workspaces/{workspaceId}/columns/{columnId}/roles:
    put:
      summary: Assign one or more business roles to column
      operationId: assignColumnRoles
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ColumnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/BusinessRole'
                overrideReason:
                  type: string
      responses:
        '200':
          description: Roles assigned
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleAssignment'
        '422':
          description: Compatibility violation (hard constraint)
  /api/v1/workspaces/{workspaceId}/readiness:
    get:
      summary: Evaluate MVP 1 readiness
      operationId: getReadiness
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/workspaces/{workspaceId}/manifest/export:
    post:
      summary: Export manifest snapshot
      operationId: exportManifest
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Manifest document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
  /api/v1/workspaces/manifest/import:
    post:
      summary: Import manifest and reconstruct workspace
      operationId: importManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestImportRequest'
      responses:
        '200':
          description: Workspace reconstructed from manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '409':
          description: Source hash mismatch; reconstruction blocked
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SheetId:
      name: sheetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ColumnId:
      name: columnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Workspace:
      type: object
      required: [id, name, status, manifestVersion]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, ready_for_mvp2]
        manifestVersion:
          type: integer
          minimum: 1
    SourceUploadResponse:
      type: object
      required: [sourceId, sheets]
      properties:
        sourceId:
          type: string
          format: uuid
        warnings:
          type: array
          items:
            type: string
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/Sheet'
    Sheet:
      type: object
      required: [id, name, headerRowEffective, dataRangeEffective]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        headerRowEffective:
          type: integer
          minimum: 1
        dataRangeEffective:
          type: string
    ColumnProfile:
      type: object
      required:
        - columnId
        - columnName
        - effectiveType
        - nullRatio
        - distinctCount
        - warnings
        - sampled
      properties:
        columnId:
          type: string
          format: uuid
        columnName:
          type: string
        effectiveType:
          type: string
          enum: [date, numeric, integer, string, boolean, categorical-candidate]
        nullRatio:
          type: number
          minimum: 0
          maximum: 1
        distinctCount:
          type: integer
          minimum: 0
        uniquenessRatio:
          type: number
          minimum: 0
          maximum: 1
        warnings:
          type: array
          items:
            type: string
        sampled:
          type: boolean
        sampleSize:
          type: integer
          nullable: true
        sampleSeed:
          type: integer
          nullable: true
    BusinessRole:
      type: string
      enum:
        - identity_key
        - time_anchor
        - measure
        - dimension
        - status
        - source_of_truth_outcome
    RoleAssignment:
      type: object
      required: [columnId, role, accepted, overrideUsed, assignedAt]
      properties:
        columnId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/BusinessRole'
        accepted:
          type: boolean
        overrideUsed:
          type: boolean
        overrideReason:
          type: string
          nullable: true
        assignedAt:
          type: string
          format: date-time
    ReadinessStatus:
      type: object
      required:
        - complete
        - missingRequiredRoles
        - unresolvedCriticalWarnings
        - surfaceRole
      properties:
        complete:
          type: boolean
        missingRequiredRoles:
          type: array
          items:
            $ref: '#/components/schemas/BusinessRole'
        unresolvedCriticalWarnings:
          type: array
          items:
            type: string
        surfaceRole:
          type: string
          enum: [exploration, analysis_workbench]
    Manifest:
      type: object
      required: [version, workspace, sourceFiles, sheets, columns, profiles, roles, overrides]
      properties:
        version:
          type: integer
          minimum: 1
        workspace:
          type: object
        sourceFiles:
          type: array
          items:
            type: object
        sheets:
          type: array
          items:
            type: object
        columns:
          type: array
          items:
            type: object
        profiles:
          type: array
          items:
            type: object
        roles:
          type: array
          items:
            type: object
        overrides:
          type: array
          items:
            type: object
        manifestHash:
          type: string
    ManifestImportRequest:
      type: object
      required: [manifest, sources]
      properties:
        manifest:
          $ref: '#/components/schemas/Manifest'
        sources:
          type: array
          items:
            type: object
            required: [filename, contentHash]
            properties:
              filename:
                type: string
              contentHash:
                type: string
