openapi: 3.0.3
info:
  title: Dashboard & Visualizations API
  version: 1.0.0
  description: API for MVP 2 dashboard composition, execution, and export
servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /workspaces/{workspace_id}/dashboards:
    get:
      summary: List dashboards in workspace for current user
      operationId: listDashboards
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
          description: Workspace ID
      responses:
        '200':
          description: List of dashboards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dashboard'
        '404':
          description: Workspace not found
    
    post:
      summary: Create a new dashboard
      operationId: createDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
        '201':
          description: Dashboard created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          description: Invalid request (duplicate name, invalid params)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspace_id}/dashboards/{dashboard_id}:
    get:
      summary: Get dashboard details
      operationId: getDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dashboard details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDetail'
        '404':
          description: Dashboard not found

    patch:
      summary: Update dashboard metadata
      operationId: updateDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardRequest'
      responses:
        '200':
          description: Dashboard updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          description: Invalid request
        '404':
          description: Dashboard not found

    delete:
      summary: Delete dashboard (soft-delete)
      operationId: deleteDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Dashboard deleted
        '404':
          description: Dashboard not found

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/panels:
    post:
      summary: Add a saved query as a panel to dashboard
      operationId: addPanelToDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPanelRequest'
      responses:
        '201':
          description: Panel added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPanel'
        '400':
          description: Invalid saved query or parameters
        '404':
          description: Dashboard or saved query not found

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/panels/{panel_id}:
    patch:
      summary: Update panel configuration (order, chart override, parameter defaults)
      operationId: updatePanel
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: panel_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePanelRequest'
      responses:
        '200':
          description: Panel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPanel'
        '400':
          description: Invalid request
        '404':
          description: Panel not found

    delete:
      summary: Remove panel from dashboard
      operationId: deletePanel
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: panel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Panel removed
        '404':
          description: Panel not found

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/run:
    post:
      summary: Manually trigger dashboard refresh
      operationId: runDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunDashboardRequest'
      responses:
        '202':
          description: Dashboard run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRun'
        '400':
          description: Invalid parameters or missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Dashboard run already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/refresh-cadence:
    patch:
      summary: Update auto-refresh cadence
      operationId: setRefreshCadence
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRefreshCadenceRequest'
      responses:
        '200':
          description: Cadence updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          description: Invalid cadence value

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/runs:
    get:
      summary: Get dashboard run history
      operationId: getDashboardRunHistory
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Number of recent runs to return
      responses:
        '200':
          description: Run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashboardRunSummary'

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/runs/{run_id}:
    get:
      summary: Get dashboard run details
      operationId: getDashboardRun
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRunDetail'

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/runs/{run_id}/panels/{panel_id}/data:
    get:
      summary: Get query results for a panel within a run
      operationId: getPanelData
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: panel_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
          description: Number of rows to return (pagination)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Panel data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelDataResponse'
        '404':
          description: Panel or run not found

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/runs/{run_id}/panels/{panel_id}/chart-suggestion:
    get:
      summary: Get auto-suggested chart type for panel
      operationId: getChartSuggestion
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: panel_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chart suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartSuggestion'
        '404':
          description: Panel not found

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/export:
    post:
      summary: Export dashboard to PNG or PDF
      operationId: exportDashboard
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDashboardRequest'
      responses:
        '200':
          description: Export generated
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid format or dashboard not ready for export
        '503':
          description: Export service unavailable

  /workspaces/{workspace_id}/dashboards/{dashboard_id}/runs/{run_id}/panels/{panel_id}/export:
    post:
      summary: Export panel data to Excel or CSV
      operationId: exportPanelData
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: panel_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportPanelRequest'
      responses:
        '200':
          description: Export generated
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        '404':
          description: Panel or run not found

components:
  schemas:
    Dashboard:
      type: object
      properties:
        dashboard_id:
          type: string
        workspace_id:
          type: string
        owner_user_id:
          type: string
        dashboard_name:
          type: string
        description:
          type: string
          nullable: true
        refresh_cadence:
          type: string
          enum: [manual, 15min, 60min]
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
        current_run_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - dashboard_id
        - workspace_id
        - owner_user_id
        - dashboard_name
        - refresh_cadence
        - created_at
        - updated_at

    DashboardDetail:
      allOf:
        - $ref: '#/components/schemas/Dashboard'
        - type: object
          properties:
            panels:
              type: array
              items:
                $ref: '#/components/schemas/DashboardPanel'

    DashboardPanel:
      type: object
      properties:
        panel_id:
          type: string
        dashboard_id:
          type: string
        saved_query_id:
          type: string
        panel_name:
          type: string
          nullable: true
        panel_order:
          type: integer
        is_visible:
          type: boolean
        chart_config_json:
          type: object
          nullable: true
          description: Analyst chart override configuration
        parameter_overrides_json:
          type: object
          nullable: true
          description: Default parameter values for this panel
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - panel_id
        - dashboard_id
        - saved_query_id
        - panel_order
        - is_visible
        - created_at
        - updated_at

    DashboardRun:
      type: object
      properties:
        run_id:
          type: string
        dashboard_id:
          type: string
        run_number:
          type: integer
        triggered_by:
          type: string
          enum: [manual, auto_15min, auto_60min]
        status:
          type: string
          enum: [pending, running, completed, failed]
        parameters_json:
          type: object
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_duration_ms:
          type: integer
          nullable: true
      required:
        - run_id
        - dashboard_id
        - run_number
        - triggered_by
        - status
        - parameters_json
        - created_at

    DashboardRunSummary:
      type: object
      properties:
        run_id:
          type: string
        run_number:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        triggered_by:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_duration_ms:
          type: integer
          nullable: true
      required:
        - run_id
        - run_number
        - status
        - triggered_by
        - created_at

    DashboardRunDetail:
      allOf:
        - $ref: '#/components/schemas/DashboardRun'
        - type: object
          properties:
            panels:
              type: array
              items:
                $ref: '#/components/schemas/DashboardRunPanel'

    DashboardRunPanel:
      type: object
      properties:
        run_panel_id:
          type: string
        panel_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        row_count:
          type: integer
          nullable: true
        is_aggregated:
          type: boolean
        error_type:
          type: string
          nullable: true
          enum: [validation, schema_drift, broken_relationship, timeout, unexpected]
        error_message:
          type: string
          nullable: true
        chart_suggestion_type:
          type: string
          nullable: true
          enum: [line, bar, scatter, pie, heatmap, table_only]
        chart_suggestion_reason:
          type: string
          nullable: true
        kpi_value:
          type: number
          nullable: true
        kpi_label:
          type: string
          nullable: true
      required:
        - run_panel_id
        - panel_id
        - status
        - is_aggregated

    PanelDataResponse:
      type: object
      properties:
        panel_id:
          type: string
        row_count:
          type: integer
        is_aggregated:
          type: boolean
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              dataType:
                type: string
        rows:
          type: array
          items:
            type: array
        has_more:
          type: boolean
          description: Whether there are more rows beyond the returned limit
      required:
        - panel_id
        - row_count
        - is_aggregated
        - columns
        - rows
        - has_more

    ChartSuggestion:
      type: object
      properties:
        chart_type:
          type: string
          enum: [line, bar, scatter, pie, heatmap, table_only]
        reason:
          type: string
          description: Explanation of why this chart type was suggested
        axes:
          type: object
          properties:
            x:
              type: string
              description: Suggested X-axis column
            y:
              type: string
              description: Suggested Y-axis column
          nullable: true
      required:
        - chart_type
        - reason

    CreateDashboardRequest:
      type: object
      properties:
        dashboard_name:
          type: string
        description:
          type: string
          nullable: true
        refresh_cadence:
          type: string
          enum: [manual, 15min, 60min]
          default: manual
      required:
        - dashboard_name

    UpdateDashboardRequest:
      type: object
      properties:
        dashboard_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        refresh_cadence:
          type: string
          enum: [manual, 15min, 60min]
          nullable: true

    AddPanelRequest:
      type: object
      properties:
        saved_query_id:
          type: string
        panel_name:
          type: string
          nullable: true
        chart_config_json:
          type: object
          nullable: true
        parameter_overrides_json:
          type: object
          nullable: true
      required:
        - saved_query_id

    UpdatePanelRequest:
      type: object
      properties:
        panel_order:
          type: integer
          nullable: true
        panel_name:
          type: string
          nullable: true
        is_visible:
          type: boolean
          nullable: true
        chart_config_json:
          type: object
          nullable: true
        parameter_overrides_json:
          type: object
          nullable: true

    RunDashboardRequest:
      type: object
      properties:
        parameters:
          type: object
          description: Parameter values for this run (merged with panel parameter_overrides)
          example:
            start_date: "2026-05-01"
            end_date: "2026-05-08"
            category: "Electronics"
      required:
        - parameters

    SetRefreshCadenceRequest:
      type: object
      properties:
        refresh_cadence:
          type: string
          enum: [manual, 15min, 60min]
      required:
        - refresh_cadence

    ExportDashboardRequest:
      type: object
      properties:
        format:
          type: string
          enum: [png, pdf]
      required:
        - format

    ExportPanelRequest:
      type: object
      properties:
        format:
          type: string
          enum: [xlsx, csv]
      required:
        - format

    ErrorResponse:
      type: object
      properties:
        error_type:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
      required:
        - error_type
        - message
