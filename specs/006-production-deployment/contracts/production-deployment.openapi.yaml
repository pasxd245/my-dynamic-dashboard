openapi: 3.0.3
info:
  title: Production Deployment Operations API
  version: 1.0.0
  description: >-
    Operational endpoints and contracts for single-host production deployment,
    health, backup, restore, and release traceability for MVP 2.
servers:
  - url: http://localhost:8000
    description: Local/production API entry

tags:
  - name: Health
  - name: Ops
  - name: Backup
  - name: Restore

paths:
  /health:
    get:
      tags: [Health]
      summary: Backend liveness and readiness probe
      operationId: getBackendHealth
      responses:
        '200':
          description: Backend healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSnapshot'
        '503':
          description: Backend started but not ready/degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSnapshot'

  /api/v1/ops/deployments/current:
    get:
      tags: [Ops]
      summary: Get active deployment bundle metadata
      operationId: getCurrentDeployment
      responses:
        '200':
          description: Active deployment bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentBundle'
        '404':
          description: No deployment bundle recorded

  /api/v1/ops/deployments:
    post:
      tags: [Ops]
      summary: Record deployment start/finish metadata
      operationId: recordDeploymentEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentEventRequest'
      responses:
        '201':
          description: Deployment event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400':
          description: Invalid payload

  /api/v1/ops/backups:
    get:
      tags: [Backup]
      summary: List recent backup artifacts
      operationId: listBackups
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Backup artifact list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupArtifact'

  /api/v1/ops/backups/run:
    post:
      tags: [Backup]
      summary: Trigger an on-demand backup run
      operationId: runBackup
      requestBody:
        required: false
      responses:
        '202':
          description: Backup started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRunAccepted'
        '409':
          description: Backup already running

  /api/v1/ops/restore:
    post:
      tags: [Restore]
      summary: Execute restore from a selected backup artifact
      operationId: runRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '202':
          description: Restore started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreRun'
        '400':
          description: Backup artifact invalid or integrity check failed
        '409':
          description: Restore blocked by conflicting operation

components:
  schemas:
    HealthDependency:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, failed]
        detail:
          type: string

    HealthSnapshot:
      type: object
      required:
        - service
        - version
        - status
        - timestamp_utc
        - dependencies
      properties:
        service:
          type: string
          example: backend
        version:
          type: string
          example: 2026.05.08+sha.abc123
        status:
          type: string
          enum: [healthy, degraded, not_ready]
        timestamp_utc:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/HealthDependency'

    DeploymentBundle:
      type: object
      required:
        - bundle_id
        - release_version
        - backend_image
        - builder_image
        - dashboard_image
        - compose_revision
        - env_contract_version
        - status
        - created_at_utc
      properties:
        bundle_id:
          type: string
        release_version:
          type: string
        backend_image:
          type: string
        builder_image:
          type: string
        dashboard_image:
          type: string
        compose_revision:
          type: string
        env_contract_version:
          type: string
        backup_set_reference:
          type: string
        status:
          type: string
          enum: [draft, validated, deployed, rolled_back, superseded]
        created_at_utc:
          type: string
          format: date-time

    DeploymentEventRequest:
      type: object
      required:
        - bundle_id
        - event_type
        - operator_id
      properties:
        bundle_id:
          type: string
        event_type:
          type: string
          enum: [deployment_started, deployment_finished, rollback_started, rollback_finished]
        operator_id:
          type: string
        message:
          type: string

    AuditEvent:
      type: object
      required:
        - event_id
        - event_type
        - service
        - severity
        - timestamp_utc
      properties:
        event_id:
          type: string
        event_type:
          type: string
        service:
          type: string
        severity:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        correlation_id:
          type: string
        message:
          type: string
        timestamp_utc:
          type: string
          format: date-time

    BackupArtifact:
      type: object
      required:
        - backup_id
        - artifact_name
        - created_at_utc
        - sqlite_integrity_ok
        - status
      properties:
        backup_id:
          type: string
        artifact_name:
          type: string
          example: metadata-20260508T030000Z.sqlite3.gz
        artifact_path:
          type: string
        created_at_utc:
          type: string
          format: date-time
        sqlite_integrity_ok:
          type: boolean
        checksum:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [created, validated, failed, retained, pruned]
        is_latest_valid:
          type: boolean

    BackupRunAccepted:
      type: object
      required:
        - run_id
        - status
        - requested_at_utc
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [accepted]
        requested_at_utc:
          type: string
          format: date-time

    RestoreRequest:
      type: object
      required:
        - backup_id
        - operator_id
      properties:
        backup_id:
          type: string
        operator_id:
          type: string
        dry_run:
          type: boolean
          default: false
        note:
          type: string

    RestoreRun:
      type: object
      required:
        - restore_run_id
        - backup_id
        - status
        - started_at_utc
      properties:
        restore_run_id:
          type: string
        backup_id:
          type: string
        status:
          type: string
          enum: [validating, restoring, completed, failed]
        validation_result:
          type: string
          enum: [passed, failed]
        started_at_utc:
          type: string
          format: date-time
        finished_at_utc:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 0
