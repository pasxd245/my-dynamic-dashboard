contract: backend-structural-alignment
version: 1.0.0
feature: 009-structural-audit-and-realignment
status: draft
owner: backend-maintainers

context:
  objective: >-
    Realign the backend application package around explicit ownership boundaries,
    adopt a single configuration manager, absorb service and schema consolidation
    work into the same round, and remove legacy metadata shims while preserving
    public behavior and backend tests.
  locked_decisions:
    - scope_boundary: backend-only-structural-audit-and-realignment
    - service_layer_scope: rewrite-absorbed-in-round
    - schema_scope: schemas-py-consolidation-in-scope
    - config_scope: appconfig-adoption-in-scope
    - excluded_work: frontend-and-tooling-adoption-out-of-scope
    - regression_rule: preserve-public-behavior-and-tests

interfaces:
  structural_audit:
    required_outputs:
      - current_to_target_move_map
      - ownership_boundary_notes
      - deferred_frontend_and_tooling_list
    evidence_sources:
      primary:
        - direct_file_read
        - import_scan
        - test_evidence
      supplemental:
        - crg_output_when_graph_coverage_is_sufficient

  target_layout:
    required_files:
      - apps/backend/app/__main__.py
      - apps/backend/app/main.py
      - apps/backend/app/shared.py
      - apps/backend/app/resources/default.yaml
    required_directories:
      - apps/backend/app/api
      - apps/backend/app/apps
      - apps/backend/app/core
      - apps/backend/app/models
      - apps/backend/app/services
      - apps/backend/app/utils

  configuration:
    manager:
      name: AppConfig
      helpers:
        - EnvVar
        - Const
        - Fields
      library_requirement: RecursiveNamespaceV2>=0.0.3
    precedence:
      order:
        - .env
        - app/resources/default.yaml
        - CONFIG_FILE
    invariants:
      - no_bare_env_reads_in_apps_backend_app
      - packaged_defaults_ship_inside_backend_package
      - entrypoints_resolve_runtime_settings_through_appconfig

  service_rewrite:
    policy:
      - rewrite_incrementally_by_service_slice
      - preserve_public_function_signatures
      - preserve_route_behavior_and_response_shapes
    allowed_internal_change:
      - sqlite3_raw_to_sqlmodel_session
    forbidden_change:
      - intentional_api_contract_regression

  schema_consolidation:
    source_surface: apps/backend/app/schemas.py
    invariants:
      - request_payload_shapes_preserved
      - response_payload_shapes_preserved
      - imports_remain_resolvable_during_transition

  metadata_shim_removal:
    removal_order:
      - stop_calling_init_metadata_db
      - remove_remaining_metadata_db_imports
      - delete_metadata_db_py
    verification:
      - command: rg "metadata_db|init_metadata_db" apps/backend/app
        expected_result: zero_hits

invariants:
  - name: behavior_stability
    requirement: Existing backend behavior remains unchanged from the caller perspective.

  - name: backend_test_stability
    requirement: Existing backend tests pass with only path/internal adjustments.

  - name: scope_control
    requirement: No frontend layout or tooling adoption changes land in this feature.

  - name: ownership_alignment
    requirement: Core contains framework primitives, apps contains orchestration, utils contains cross-cutting utilities.

verification:
  required_checks:
    - approved_structural_audit_exists
    - target_layout_present_under_apps_backend_app
    - rg_os_getenv_or_os_environ_returns_zero_hits
    - rg_metadata_db_or_init_metadata_db_returns_zero_hits_after_cleanup
    - backend_config_precedence_checks_pass
    - api_contract_checks_pass_after_schema_consolidation
    - backend_pytest_suite_passes
  evidence_artifacts:
    - research_md
    - layout_diff_or_tree_output
    - grep_output
    - pytest_output
    - focused_api_contract_verification_output

out_of_scope:
  - builder_or_other_frontend_layout_changes
  - tooling_adoption_pyproject_ruff_commitizen_hatch_vcs
  - intentional_relationship_rule_semantic_changes
  - intentional_public_api_redesign